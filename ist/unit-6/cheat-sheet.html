<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cheat Sheet | Web Design - HTML</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="../../assets/logo.png"><link rel="stylesheet" href="../unit-4/notes.css">
<style>
:root{--acc:#FB923C;--acc-tint:rgba(251,146,60,.13);--acc-ink:#FED7AA}
body{margin:0}
.top{position:sticky;top:0;z-index:20;background:#0B0E14f2;backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);padding:16px 0 14px}
.wrapx{max-width:980px;margin:0 auto;padding:0 18px}
.top h1{font-family:"Fraunces",serif;font-size:26px;margin:0 0 4px;color:#fff}
.top p{margin:0 0 12px;color:var(--ink-soft);font-size:14px}
#q{width:100%;box-sizing:border-box;font:600 18px "JetBrains Mono",monospace;color:#fff;background:#05070B;border:2px solid var(--rule);border-radius:12px;padding:14px 16px;outline:none}
#q:focus{border-color:var(--acc)}
#q::placeholder{color:#6B7788;font-weight:500}
main{padding:22px 0 80px}
.hint{color:var(--ink-soft);line-height:1.8;font-size:15px}
.hint code{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:2px 8px;margin:0 3px;display:inline-block}
.card{border:1px solid var(--rule);background:rgba(255,255,255,.025);border-radius:14px;padding:22px 24px 10px;margin:0 0 26px}
.card h2{font-family:"JetBrains Mono",monospace;font-size:24px;margin:0 0 6px;color:#fff;word-break:break-word}
.kind{display:inline-block;font:700 11px "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:#0B0E14;background:var(--acc);border-radius:100px;padding:3px 10px;margin-bottom:10px}
.say{font-size:17px;line-height:1.65;margin:6px 0 14px;color:#E4E9F0}
h3.sec{font:700 12px "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--acc-ink);margin:18px 0 8px}
.pts2{display:grid;gap:6px;margin:0 0 6px}
.pt{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.pt code{font:600 13.5px "JetBrains Mono",monospace;background:#05070B;border:1px solid var(--rule);border-radius:6px;padding:3px 9px;color:#FED7AA;white-space:pre-wrap}
.pt>span{color:#C4CDD8;font-size:15px}
.tip{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.45);border-left:4px solid #F87171;border-radius:6px;padding:10px 16px;margin:14px 0;color:#C4CDD8;font-size:15px;line-height:1.55}
.tip b{color:#FCA5A5}
.ex{border-top:1px solid var(--rule);padding:16px 0 18px}
.exl{font:700 12px "JetBrains Mono",monospace;letter-spacing:.05em;text-transform:uppercase;color:#0B0E14;background:var(--acc);display:inline-block;padding:3px 10px;border-radius:100px;margin-right:8px}
.excap{font-weight:600;color:#fff;font-size:15.5px}
.demo{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-top:12px;align-items:start}
.demo.one{grid-template-columns:minmax(0,1fr)}
@media(max-width:760px){.demo{grid-template-columns:minmax(0,1fr)}}
.bx h4{font:600 11px "JetBrains Mono",monospace;letter-spacing:.05em;text-transform:uppercase;color:var(--acc-ink);margin:0 0 6px}
pre.code{margin:0;background:#05070B;border:1px solid var(--rule);border-radius:8px;padding:14px 16px;font:13px/1.6 "JetBrains Mono",monospace;color:#E8ECF3;overflow-x:auto;white-space:pre;tab-size:2}
pre.code .ann{color:#E2E8F0;font-weight:600}
/* the same colors the HTML editor uses for tags, attributes, properties and values */
.t-tag{color:#FB7185}.t-style{color:#F472B6}.t-attr{color:#FBBF24}.t-id{color:#22D3EE}.t-id-v{color:#67E8F9}.t-class{color:#A78BFA}.t-class-v{color:#C4B5FD}.t-val{color:#86EFAC}.t-br{color:#7C8AA5}.t-eq{color:#7C8AA5}
.c-prop{color:#60A5FA}.c-hex{color:#FDBA74}.c-num{color:#FDBA74}.c-kw{color:#34D399}.c-pun{color:#7C8AA5}.c-cm{color:#5B6B85;font-style:italic}
.pt code{color:#E6EAF2}.card h2{color:#E6EAF2}
iframe.out{width:100%;border:1px solid var(--rule);border-radius:8px;background:#fff;display:block;height:70px}
.more{color:var(--ink-soft);font-size:14px;margin:0 0 22px}
.more a{color:var(--acc-ink);cursor:pointer;text-decoration:underline;margin-right:10px}
.none{color:var(--ink-soft);line-height:1.7}
</style>
</head>
<body>
<div class="top"><div class="wrapx">
  <h1>HTML Cheat Sheet</h1>
  <p>Type a tag, attribute, or value and see what it does, with examples.</p>
  <input id="q" type="search" list="sugg" placeholder="Try:  p   href   color   border   ul" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
  <datalist id="sugg"></datalist>
</div></div>
<main><div class="wrapx" id="res"></div></main>

<script src="html-check.js"></script>
<script src="syntax-colors.js"></script>
<script src="cheat-data.js"></script>
<script>
(function () {
  var D = window.CHEAT, $ = function (id) { return document.getElementById(id); };
  var PIC = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200"><rect width="300" height="200" fill="#8ecae6"/><circle cx="150" cy="95" r="55" fill="#2b2d42"/><circle cx="130" cy="85" r="8" fill="#fff"/><circle cx="170" cy="85" r="8" fill="#fff"/><ellipse cx="150" cy="112" rx="14" ry="9" fill="#e5989b"/></svg>');
  var esc = function (s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); };
  var norm = function (s) { return String(s).toLowerCase().replace(/[^a-z0-9%#.]/g, ""); };   /* "<p>", "background color", "_blank" all become plain letters */
  var nrm2 = function (s) { return norm(s).replace(/[#.%]/g, ""); };

  /* ---- search words for every entry ---- */
  D.forEach(function (e) {
    var main = e.n.replace(/\(.*?\)/g, " ");
    e.names = [nrm2(main)].concat(e.al.map(nrm2));
    e.words = (e.k + " " + e.kind).toLowerCase().split(/\s+/).map(nrm2).filter(Boolean);
    e.pieces = main.split(/[,\s]+|\band\b/).map(nrm2).filter(function (x) { return x.length > 1 && x !== "to"; });
  });
  var dl = $("sugg"), seen = {};
  D.forEach(function (e) { e.al.concat([e.n.replace(/[<>]/g, "").replace(/\s*\(.*?\)\s*/, "")]).forEach(function (a) { a = a.trim(); if (a && a.length < 22 && !seen[a]) { seen[a] = 1; dl.insertAdjacentHTML("beforeend", '<option value="' + esc(a) + '">'); } }); });

  function score(e, q) {
    var best = 0, i;
    for (i = 0; i < e.names.length; i++) {
      var n = e.names[i]; if (!n) continue;
      if (n === q) best = Math.max(best, i === 0 ? 100 : 96);
      else if (n.indexOf(q) === 0 && q.length > 1) best = Math.max(best, 80);
      else if (q.length > 2 && n.indexOf(q) > -1) best = Math.max(best, 50);
    }
    e.pieces.forEach(function (p) { if (p === q) best = Math.max(best, 90); else if (q.length > 1 && p.indexOf(q) === 0) best = Math.max(best, 70); });
    if (q.length > 2) e.words.forEach(function (w) { if (w === q) best = Math.max(best, 40); else if (w.indexOf(q) === 0) best = Math.max(best, 30); });
    return best;
  }

  /* ---- colors: the editor's own highlighter ---- */
  var SYN = window.SYNTAX, sp = function (c, s) { return '<span class="' + c + '">' + esc(s) + "</span>"; };
  function valueCss(s) { return SYN.decls("a:" + s).replace(/^a<span class="c-pun">:<\/span>/, ""); }
  function inTag(s) { return SYN.tag("<p " + s + ">").replace(/^<span class="t-br">&lt;<\/span><span class="t-tag">p<\/span> ?/, "").replace(/<span class="t-br">&gt;<\/span>$/, ""); }
  /* a little code snippet from a "Break it down" row: color it the way the editor would */
  function colorSnippet(s) {
    var t = String(s).trim(), h;
    if (/^<[\/!a-zA-Z]/.test(t)) return SYN.html(t);                                   /* <p>  </p>  <meta charset="utf-8"> */
    if (/^[a-zA-Z-]+\s*=/.test(t)) return inTag(t);                                    /* style=  href="..."  target="_blank" */
    if (/^["'].*["']$/.test(t)) return sp("t-val", t);                                 /* "dog.jpg" */
    if (/^#[0-9a-f]{3,8}$/i.test(t)) return sp("c-hex", t);                            /* #FF6347 */
    if (/^[a-z-]+\s*:/i.test(t) && !/^:/.test(t)) return SYN.decls(t);                 /* color: teal;  border: */
    if (/^[.#:][\w-]/.test(t) || /\{/.test(t)) return SYN.css(t);                      /* .note  #title  :hover  p { */
    if (/^[a-z-]+$/.test(t)) { var ah = inTag(t + '=""').match(/^<span class="t-(?:attr|style|id|class)">[^<]*<[/]span>/); if (ah) return ah[0]; }   /* a bare attribute name like href */
    h = valueCss(t); return /class="c-(kw|num|hex)"/.test(h) ? h : esc(s);             /* 3px  solid red  teal  (plain words stay plain) */
  }
  /* plain sentences: any <tag> typed inside them gets the editor's tag colors */
  function rich(s) { var out = "", last = 0, re = /<[/]?[a-zA-Z][^<>]*>/g, m; s = String(s); while ((m = re.exec(s))) { out += esc(s.slice(last, m.index)) + SYN.html(m[0]); last = re.lastIndex; } return out + esc(s.slice(last)); }
  function colorTitle(e) {
    var n = e.n;
    if (e.kind === "tag" || /^[<:.]/.test(n)) return /^:/.test(n) ? SYN.css(n) : SYN.html(n);
    if (e.kind === "attribute") return /=/.test(n) ? inTag(n) : sp(n === "style" ? "t-style" : n === "id" ? "t-id" : n === "class" ? "t-class" : "t-attr", n);
    if (e.kind === "property") return sp("c-prop", n);
    return esc(n);
  }

  /* ---- code with arrows ---- */
  function arrowCode(c, anns) {
    var lines = c.split("\n"), hlLines = SYN.html(c).split("\n"), byLine = {}, starts = [], pos = 0;
    lines.forEach(function (l) { starts.push(pos); pos += l.length + 1; });
    anns.forEach(function (a) {
      var idx = c.indexOf(a[0]); if (idx < 0) return;
      var ln = 0; while (ln + 1 < lines.length && starts[ln + 1] <= idx) ln++;
      (byLine[ln] = byLine[ln] || []).push({ col: idx - starts[ln], cap: a[1] });
    });
    var out = [];
    lines.forEach(function (l, i) {
      out.push(hlLines.length === lines.length ? hlLines[i] : esc(l));
      var A = byLine[i]; if (!A) return;
      A.sort(function (x, y) { return x.col - y.col; });
      var w = A[A.length - 1].col + 1, row = function () { var r = []; for (var k = 0; k < w; k++) r.push(" "); return r; };
      var r0 = row(); A.forEach(function (a) { r0[a.col] = "↑"; }); out.push('<span class="ann">' + r0.join("").replace(/\s+$/, "") + "</span>");
      for (var k = A.length - 1; k >= 0; k--) {
        var r = row(); for (var j = 0; j < k; j++) r[A[j].col] = "│";
        r[A[k].col] = "└"; out.push('<span class="ann">' + esc(r.slice(0, A[k].col + 1).join("") + "─ " + A[k].cap) + "</span>");
      }
    });
    return out.join("\n");
  }

  /* ---- preview: a sandboxed little page ---- */
  function srcdoc(c) {
    var code = c.replace(/(<img[^>]*?\ssrc=")[^"]*(")/g, "$1" + PIC + "$2");
    return '<!doctype html><meta charset="utf-8"><base target="_blank"><link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Lobster&family=Special+Elite&display=swap" rel="stylesheet"><style>body{font:16px Georgia,serif;margin:12px;color:#111;background:#fff}</style>' + code;
  }

  function card(e) {
    var h = '<article class="card"><span class="kind">' + esc(e.kind) + "</span><h2>" + colorTitle(e) + '</h2><p class="say">' + rich(e.say) + "</p>";
    if (e.parts.length) { h += '<h3 class="sec">Break it down</h3><div class="pts2">'; e.parts.forEach(function (p) { h += '<div class="pt"><code>' + colorSnippet(p[0]) + "</code><span>" + rich(p[1]) + "</span></div>"; }); h += "</div>"; }
    if (e.tip) h += '<div class="tip"><b>Watch out:</b> ' + rich(e.tip) + "</div>";
    e.ex.forEach(function (x, i) {
      h += '<div class="ex"><span class="exl">Example ' + (i + 1) + '</span><span class="excap">' + esc(x.cap) + '</span><div class="demo' + (x.r ? "" : " one") + '"><div class="bx"><h4>Code</h4><pre class="code">' + arrowCode(x.c, x.a) + "</pre></div>";
      if (x.r) h += '<div class="bx"><h4>What the browser shows</h4><iframe class="out" sandbox="allow-same-origin" title="Result" data-src="' + esc(srcdoc(x.c)).replace(/"/g, "&quot;") + '"></iframe></div>';
      h += "</div></div>";
    });
    return h + "</article>";
  }

  function fit(f) { try { var d = f.contentDocument; f.style.height = Math.min(Math.max(d.documentElement.scrollHeight, d.body.scrollHeight) + 4, 360) + "px"; } catch (e) {} }
  function mount() {
    Array.prototype.forEach.call(document.querySelectorAll("iframe.out[data-src]"), function (f) {
      f.addEventListener("load", function () { fit(f); setTimeout(function () { fit(f); }, 700); });
      f.srcdoc = f.getAttribute("data-src"); f.removeAttribute("data-src");
    });
  }

  var HINT = '<p class="hint">Type what you want to look up, and it shows up here.<br>Try a tag like <code>p</code> <code>img</code> <code>a</code> <code>ul</code>, an attribute like <code>href</code> <code>src</code> <code>class</code>, or a style like <code>color</code> <code>border</code> <code>padding</code> <code>center</code>.<br>You can type it with or without the &lt; &gt; marks.</p>';
  function run(raw) {
    var res = $("res"), tagm = String(raw).match(/<\s*\/?\s*([a-zA-Z][a-zA-Z0-9]*)/), q = /^\s*%\s*$/.test(raw) ? "percent" : nrm2(tagm ? tagm[1] : raw);   /* "<p></p>" finds p */
    if (!q) { res.innerHTML = HINT; return; }
    function find(qq) { return D.map(function (e) { return { e: e, s: score(e, qq) }; }).filter(function (x) { return x.s > 0; }).sort(function (a, b) { return b.s - a.s; }); }
    var hits = /^\s*#[0-9a-f]{3}([0-9a-f]{3})?\s*$/i.test(raw) ? find("hex") : /^\s*\.[a-z]/i.test(raw) ? find("class") : /^\s*#[a-z]/i.test(raw) ? find("id") : find(q);   /* ".note" is a class selector, "#title" an id selector */
    if (!hits.length) { res.innerHTML = '<p class="none">Nothing found for <b>' + esc(raw) + "</b>. Check the spelling, or try a shorter word like <code>img</code>, <code>color</code>, or <code>border</code>.</p>"; return; }
    var gap = hits[0].s >= 90 ? 10 : 20, top = hits.filter(function (x) { return x.s >= hits[0].s - gap; }).slice(0, 3), rest = hits.filter(function (x) { return top.indexOf(x) < 0; }).slice(0, 8), h = "";
    top.forEach(function (x) { h += card(x.e); });
    if (rest.length) { h += '<p class="more">Also matches: '; rest.forEach(function (x) { h += '<a data-go="' + D.indexOf(x.e) + '">' + esc(x.e.n) + "</a>"; }); h += "</p>"; }
    res.innerHTML = h; mount();
  }
  $("res").addEventListener("click", function (ev) { var g = ev.target.getAttribute && ev.target.getAttribute("data-go"); if (g !== null && g !== undefined) { var e = D[+g]; $("q").value = e.al[0] || e.n.replace(/[<>]/g, "").replace(/\s*\(.*$/, ""); run($("q").value); window.scrollTo(0, 0); } });
  var t; $("q").addEventListener("input", function () { clearTimeout(t); var v = this.value; t = setTimeout(function () { run(v); }, 120); });
  var init = (location.search.match(/[?&]q=([^&]*)/) || [])[1]; if (init) { init = decodeURIComponent(init); $("q").value = init; }
  run(init || "");
})();
</script>
</body></html>
