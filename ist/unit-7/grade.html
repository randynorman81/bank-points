<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Grade Unit 7 Websites | Teacher</title>
<link rel="icon" href="../../assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0E14;--panel:#121722;--card:#171D2B;--rule:#26304A;--ink:#E8ECF3;--soft:#93A0B8;--acc:#FB923C;--ok:#34D399;--bad:#F87171;--warn:#FBBF24}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "Manrope",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
a{color:#FDBA74}button,select,input,textarea{font:inherit}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--rule)}
.brand{font-weight:800}
select,input,textarea{background:var(--card);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:6px 8px}
.btn{background:var(--card);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);color:#0B0E14;border-color:var(--acc);font-weight:800}.btn.sm{padding:3px 8px;font-size:12px}
.btn[disabled]{opacity:.5}
.sp{flex:1}
#login{max-width:340px;margin:12vh auto;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:24px}
#login h1{margin:0 0 10px;font-size:20px}
#login input{width:100%;margin:8px 0 12px}
#app{display:none;flex:1;min-height:0;grid-template-columns:400px 1fr}
#app.show{display:grid}
.list{border-right:1px solid var(--rule);overflow:auto;background:var(--bg)}
.list table{width:100%;border-collapse:collapse;font-size:13px}
.list th{position:sticky;top:0;background:var(--panel);text-align:left;padding:7px 8px;font:700 11px "JetBrains Mono",monospace;color:var(--soft);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--rule);cursor:pointer}
.list td{padding:8px;border-bottom:1px solid #1b2337;vertical-align:top}
.list tr.row{cursor:pointer}.list tr.row:hover{background:#141a29}.list tr.row.sel{background:#1c2540;outline:1px solid var(--acc)}
.pill{display:inline-block;border-radius:100px;padding:1px 8px;font-size:11px;font-weight:700}
.pill.s{background:#0F2A22;color:#6EE7B7}.pill.d{background:#2A2110;color:#FCD34D}.pill.g{background:#14213D;color:#93C5FD}
.num{font-family:"JetBrains Mono",monospace}
.detail{display:flex;flex-direction:column;min-width:0;min-height:0}
.dhead{padding:10px 14px;border-bottom:1px solid var(--rule);display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel)}
.dhead h2{margin:0;font-size:17px}
.dhead small{color:var(--soft)}
.ansv{padding:16px 18px;overflow:auto;height:100%}
.ansv h3{margin:18px 0 8px;font-size:14px;color:#FDBA74}.ansv h3:first-child{margin-top:0}
.ansv .a1{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;margin:0 0 8px}
.ansv .a1 .k{color:var(--soft);font-size:12px;margin-bottom:2px}
.ansv .a1 .v{white-space:pre-wrap;word-break:break-word}
.ansv .a1 .v.e{color:#F87171;font-style:italic}
.ansv .g{background:#101627;border:1px solid var(--rule);border-radius:10px;padding:10px 12px;margin:0 0 10px}
.ansv .g>b{display:block;color:#fff;margin-bottom:6px}
.ansv .g .a1{margin:0 0 6px}
.ansv .sum{color:var(--soft);font-size:13px;margin:0 0 12px}
.dtabs{display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid var(--rule)}
.dtabs button.on{background:var(--acc);color:#0B0E14;border-color:var(--acc)}
.dbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 320px}
.view{min-height:0;overflow:auto;position:relative}
.code{display:flex;font:13px/20px "JetBrains Mono",monospace;background:#080B11;min-height:100%}
.code .g{flex:0 0 46px;text-align:right;color:#4E5B78;padding:10px 8px 10px 0;border-right:1px solid var(--rule);user-select:none;white-space:pre}
.code .g div.err{background:#7f1d1d;color:#fff}
.code pre{margin:0;padding:10px 14px;white-space:pre;color:#E6EAF2;flex:1;min-width:0;overflow:visible}
iframe{width:100%;height:100%;border:0;background:#fff;display:block}
.right{border-left:1px solid var(--rule);overflow:auto;padding:12px;background:var(--bg)}
.right h3{margin:14px 0 6px;font:700 11.5px "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.right h3:first-child{margin-top:0}
.rule{display:flex;gap:7px;padding:4px 0;font-size:12.5px;line-height:1.35}
.rule .m{flex:0 0 17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:800;margin-top:1px}
.rule.ok .m{background:var(--ok);color:#04210f}.rule.no .m{background:#3a1c1c;color:var(--bad);border:1px solid var(--bad)}
.rule.ok{color:#B7F1D4}
.old{opacity:.7}
.prob{padding:5px 8px;border-radius:6px;margin:5px 0;font-size:12px}
.prob.e{background:#2A1414;border-left:3px solid var(--bad)}.prob.w{background:#2A2110;border-left:3px solid var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:4px}.chips span{background:var(--card);border:1px solid var(--rule);border-radius:100px;padding:1px 8px;font:11.5px "JetBrains Mono",monospace}.chips b{color:var(--acc)}
.grade input[type=number]{width:90px}
.grade textarea{width:100%;min-height:90px;margin:6px 0}
.big{font-size:30px;font-weight:800;color:var(--acc)}
.code pre mark{background:#7a4a00;color:#fff;border-radius:2px;box-shadow:0 0 0 1px #f59e0b}
.org{border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:12.5px}
.org.red{background:#2A1414;border:1px solid #F87171}.org.yellow{background:#2A2110;border:1px solid #FBBF24}.org.green{background:#0F2A22;border:1px solid #34D399}.org.none{background:#171D2B;border:1px solid var(--rule)}
.org b.t{display:block;font-size:14px;margin-bottom:4px}
.org ul{margin:6px 0 0 16px;padding:0}.org li{margin:3px 0}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:12px;margin:6px 0}.kv span:nth-child(odd){color:var(--soft)}
.ev{border-top:1px solid var(--rule);padding:6px 0;font-size:12px}.ev code{display:block;color:#FCD34D;white-space:pre-wrap;word-break:break-word;margin-top:2px}
.srch a{display:block;padding:4px 0;font-size:12px;border-top:1px solid var(--rule)}
.empty{padding:40px;color:var(--soft);text-align:center}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111c;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;display:none;z-index:9}
@media(max-width:1000px){#app{grid-template-columns:1fr}.list{max-height:34vh}.dbody{grid-template-columns:1fr}.right{border-left:0}}
</style>
</head>
<body>
<div id="login">
  <h1>Teacher: Grade Unit 7 Websites</h1>
  <div style="color:var(--soft);font-size:13px">Enter the teacher PIN.</div>
  <input id="pin" type="password" placeholder="PIN" autocomplete="off">
  <button class="btn pri" id="go" style="width:100%">Open</button>
  <div id="lerr" style="color:var(--bad);margin-top:10px;font-size:13px"></div>
  <div style="margin-top:14px"><a href="index.html">&larr; Unit 7</a></div>
</div>

<div class="top" id="top" style="display:none">
  <span class="brand">🧑‍🏫 Grade Websites</span>
  <label>Lesson <select id="lesson"></select></label>
  <label>Period <select id="period"><option value="">All</option></select></label>
  <label><input type="checkbox" id="onlySub"> Submitted only</label>
  <button class="btn" id="reload">Reload</button>
  <button class="btn" id="csv">Export CSV</button>
  <button class="btn" id="bulk" title="Fill in the teacher score for every ungraded submission with the auto score">Use auto score for ungraded</button>
  <span class="sp"></span>
  <span id="count" style="color:var(--soft);font-size:13px"></span>
  <a class="btn" href="index.html">Unit 7</a>
</div>

<div id="app">
  <div class="list"><table><thead><tr><th data-k="name">Student</th><th data-k="status">Status</th><th data-k="auto">Auto</th><th data-k="orig" title="Originality flag from copy/paste tracking">Orig.</th><th data-k="teacher">Grade</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="noRows" style="display:none">No work for this lesson yet.</div></div>
  <div class="detail" id="detail"><div class="empty">Pick a student on the left.</div></div>
</div>
<div class="toast" id="toast"></div>

<script src="answers.js"></script>
<script src="answers-early.js"></script>
<script src="html-check.js"></script>
<script>
"use strict";
var API = "/api/code", $ = function (i) { return document.getElementById(i); }, H = window.HTMLCheck;
var pin = sessionStorage.getItem("u7pin") || "", rowsData = [], selEmail = null, sortKey = "name", sortDir = 1, view = "code";
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function toast(t) { var x = $("toast"); x.textContent = t; x.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(function () { x.style.display = "none"; }, 2000); }
function fmt(iso) { try { return new Date(iso).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); } catch (e) { return iso || ""; } }
function api(b) { b.pin = pin; return fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) }).then(function (r) { return r.json(); }); }

/* ---------- login ---------- */
function openApp() {
  api({ action: "adminCounts" }).then(function (j) {
    if (j.error) { $("lerr").textContent = j.error; sessionStorage.removeItem("u7pin"); return; }
    sessionStorage.setItem("u7pin", pin);
    $("login").style.display = "none"; $("top").style.display = ""; $("app").classList.add("show");
    var sel = $("lesson"); sel.innerHTML = "";
    H.ORDER.forEach(function (l) { var o = document.createElement("option"); o.value = l; o.textContent = l + " " + H.LESSONS[l].name + "  (" + (j.counts[l] || 0) + ")"; sel.appendChild(o); });
    var q = new URLSearchParams(location.search).get("lesson"); if (q && H.LESSONS[q]) sel.value = q;
    load();
  }).catch(function () { $("lerr").textContent = "Could not reach the server."; });
}
$("go").onclick = function () { pin = $("pin").value; openApp(); };
$("pin").onkeydown = function (e) { if (e.key === "Enter") $("go").click(); };
if (pin) openApp();

/* ---------- originality: typing vs. pasting ---------- */
var PASTE_MIN = 25;   // characters. Pasting less than this (a hex code, a web address) is fine.
var PENALTY = 0.5;    // 50% off when content copied from outside is still in the page
var LV = { red: "\uD83D\uDD34", yellow: "\uD83D\uDFE1", green: "\uD83D\uDFE2", none: "\u26AA" }, LVN = { red: 3, yellow: 2, green: 1, none: 0 };
function analyzeOrigin(r) {
  var act = (r.sub && r.sub.activity) || (r.draft && r.draft.activity) || null, code = r.code || "", css = r.css || "";
  var o = { penalize: false, has: !!act, level: "none", act: act, ranges: [], inFinal: 0, total: code.length + css.length, unexplained: 0, minutes: 0, words: 0, wpm: 0, pct: 0, reasons: [], events: [], paras: [] };
  var c = H.analyze(code), body = c.all("body")[0]; o.words = body ? c.words(body) : 0;
  c.all("p").forEach(function (p) { var t = c.text(p).replace(/\s+/g, " ").trim(), w = t ? t.split(" ") : []; if (w.length >= 15) o.paras.push({ len: w.length, q: w.slice(0, 14).join(" ") }); });
  o.paras.sort(function (a, b) { return b.len - a.len; }); o.paras = o.paras.slice(0, 8);
  if (!act) return o;
  function findRanges(text, hay) {
    var t = text.trim(), rs = [], W = 25, step = 8;
    if (t.length < W) return rs;
    for (var i = 0; i + W <= t.length && rs.length < 400; i += step) { var w = t.slice(i, i + W), at = hay.indexOf(w); if (at > -1) rs.push([at, at + W]); }
    var last = t.slice(-W), la = hay.indexOf(last); if (la > -1) rs.push([la, la + W]);
    return rs;
  }
  var allRanges = [];
  act.events.forEach(function (e) {
    if (!e.ext) return; var t = (e.txt || ""), inF = false;
    var rc = findRanges(t, code), rcss = findRanges(t, css), total = 0;
    var hitsNeeded = Math.max(1, Math.ceil(((t.trim().length - 25) / 8 + 1) * 0.25));
    if (rc.length >= hitsNeeded || rcss.length >= hitsNeeded) inF = true;
    if (inF) { rc.forEach(function (g) { allRanges.push(g); }); }
    o.events.push({ e: e, inFinal: inF });
  });
  // merge overlapping ranges so highlighting and character counts are accurate
  allRanges.sort(function (a, b) { return a[0] - b[0]; });
  var merged = []; allRanges.forEach(function (g) { var m = merged[merged.length - 1]; if (m && g[0] <= m[1]) m[1] = Math.max(m[1], g[1]); else merged.push([g[0], g[1]]); });
  o.ranges = merged; o.inFinal = merged.reduce(function (n, g) { return n + (g[1] - g[0]); }, 0);
  if (!o.inFinal) o.events.forEach(function (x) { if (x.inFinal) o.inFinal += Math.min(x.e.n, 60); });
  o.penalize = o.inFinal >= PASTE_MIN;
  o.pct = o.total ? o.inFinal / o.total : 0;
  o.unexplained = o.total - (act.base + act.typed + act.pasted + act.auto + act.loaded);
  o.minutes = act.activeMs / 60000; o.wpm = o.minutes > 0.3 ? o.words / o.minutes : 0;
  var lvl = "green";
  function raise(l, msg) { o.reasons.push(msg); if (LVN[l] > LVN[lvl]) lvl = l; }
  if (o.penalize && o.level !== "red") lvl = "yellow";
  if (o.pct >= 0.4 || o.inFinal >= 600) raise("red", "About " + Math.round(o.pct * 100) + "% of the page (" + o.inFinal + " characters) was pasted from outside the editor.");
  else if (o.pct >= 0.15 || o.inFinal >= 200) raise("yellow", "About " + Math.round(o.pct * 100) + "% of the page (" + o.inFinal + " characters) was pasted from outside the editor.");
  if (o.unexplained > Math.max(800, o.total * 0.6)) raise("red", o.unexplained + " characters of the page appeared without being typed or pasted here.");
  else if (o.unexplained > Math.max(300, o.total * 0.3)) raise("yellow", o.unexplained + " characters of the page appeared without being typed or pasted here.");
  if (o.wpm > 90 && o.words >= 150) raise("yellow", "Wrote " + o.words + " words in only " + o.minutes.toFixed(1) + " active minutes (" + Math.round(o.wpm) + " words per minute).");
  if (o.penalize) o.reasons.unshift("Copied content is still in the page, so the 50% originality penalty applies.");
  if (!o.reasons.length) o.reasons.push("Looks like the student typed this page themselves.");
  o.level = lvl; return o;
}
function highlight(code, ranges) {
  ranges = ranges.slice().sort(function (a, b) { return a[0] - b[0]; });
  var out = "", pos = 0;
  ranges.forEach(function (g) { if (g[0] < pos) return; out += esc(code.slice(pos, g[0])) + '<mark title="Pasted from outside the editor">' + esc(code.slice(g[0], g[1])) + "</mark>"; pos = g[1]; });
  return out + esc(code.slice(pos));
}

/* ---------- load + compute ---------- */
function load() {
  var lesson = $("lesson").value;
  $("rows").innerHTML = ""; $("count").textContent = "Loading…";
  api({ action: "adminList", lesson: lesson }).then(function (j) {
    if (j.error) { toast(j.error); return; }
    rowsData = j.students.map(function (s) {
      var _row;
      var code = s.submission ? s.submission.code : (s.draft ? s.draft.code : ""), css = s.submission ? (s.submission.css || "") : (s.draft ? (s.draft.css || "") : "");
      var rep = H.check(lesson, code);
      _row = { email: s.email, name: s.name || s.email, period: s.period || (s.submission && s.submission.period) || "", sub: s.submission, draft: s.draft, code: code, css: css, rep: rep, status: s.submission ? "submitted" : "draft", teacher: s.submission ? s.submission.teacher : null };
      _row.org = analyzeOrigin(_row);
      _row.pasteBad = !!_row.org.penalize;
      _row.wq = H.quality(code);
      if (_row.wq.severe) {
        _row.org.penalize = true;
        if (!_row.org.has || !_row.org.reasons.length || _row.org.reasons[0] === "Looks like the student typed this page themselves.") _row.org.reasons = [];
        _row.org.reasons.unshift("Writing check: the writing looks like nonsense or the same content repeated, so the 50% penalty applies.");
        _row.org.level = "red";
      }
      return _row;
    });
    var periods = {}; rowsData.forEach(function (r) { if (r.period) periods[r.period] = 1; });
    var ps = $("period"), cur = ps.value; ps.innerHTML = '<option value="">All</option>' + Object.keys(periods).sort().map(function (p) { return "<option>" + esc(p) + "</option>"; }).join(""); ps.value = cur;
    render();
  });
}
$("lesson").onchange = function () { selEmail = null; $("detail").innerHTML = '<div class="empty">Pick a student on the left.</div>'; load(); };
$("period").onchange = render; $("onlySub").onchange = render; $("reload").onclick = load;

function visible() {
  var p = $("period").value, only = $("onlySub").checked;
  var a = rowsData.filter(function (r) { return (!p || r.period === p) && (!only || r.status === "submitted"); });
  a.sort(function (x, y) {
    var kx, ky;
    if (sortKey === "name") { kx = x.name.toLowerCase(); ky = y.name.toLowerCase(); }
    else if (sortKey === "status") { kx = x.status; ky = y.status; }
    else if (sortKey === "auto") { kx = x.rep.score; ky = y.rep.score; }
    else if (sortKey === "orig") { kx = LVN[x.org.level]; ky = LVN[y.org.level]; }
    else { kx = x.teacher && x.teacher.score != null ? x.teacher.score : -1; ky = y.teacher && y.teacher.score != null ? y.teacher.score : -1; }
    return (kx < ky ? -1 : kx > ky ? 1 : 0) * sortDir;
  });
  return a;
}
function render() {
  var a = visible(), h = "";
  a.forEach(function (r) {
    var g = r.teacher && r.teacher.score != null ? r.teacher.score : "";
    h += '<tr class="row' + (r.email === selEmail ? " sel" : "") + '" data-e="' + esc(r.email) + '"><td><b>' + esc(r.name) + '</b><br><small style="color:var(--soft)">' + esc(r.period) + "</small></td><td>" +
      (r.status === "submitted" ? '<span class="pill s">Submitted</span><br><small style="color:var(--soft)">' + esc(fmt(r.sub.submittedAt)) + (r.sub.count > 1 ? " (#" + r.sub.count + ")" : "") + "</small>" : '<span class="pill d">Draft only</span>') +
      '</td><td class="num">' + r.rep.score + (r.rep.errors.length ? '<br><small style="color:var(--bad)">' + r.rep.errors.length + " err</small>" : "") + '</td><td title="' + esc(r.org.reasons.join(" ")) + '">' + LV[r.org.level] + (r.org.penalize ? '<br><small style="color:#FCA5A5">-50%</small>' : '') + '</td><td class="num">' + (g !== "" ? '<span class="pill g">' + esc(g) + "</span>" : "") + "</td></tr>";
  });
  $("rows").innerHTML = h; $("noRows").style.display = a.length ? "none" : "block";
  var subs = rowsData.filter(function (r) { return r.status === "submitted"; }).length, graded = rowsData.filter(function (r) { return r.teacher && r.teacher.score != null; }).length;
  $("count").textContent = subs + " submitted, " + graded + " graded, " + (rowsData.length - subs) + " draft only";
}
$("rows").onclick = function (e) { var t = e.target.closest("tr.row"); if (t) select(t.getAttribute("data-e")); };
document.querySelector(".list thead").onclick = function (e) { var th = e.target.closest("th"); if (!th) return; var k = th.getAttribute("data-k"); if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = (k === "orig") ? -1 : 1; } render(); };

/* ---------- typed answers ---------- */
function ansOf(r) { return (r.sub && r.sub.answers) || (r.draft && r.draft.answers) || {}; }
function ansSummary(r) {
  var sc = window.U7_ANSWERS && window.U7_ANSWERS[$("lesson").value]; if (!sc) return "";
  var L = window.U7_ANSWER_LEAVES(sc), a = ansOf(r), n = 0; L.forEach(function (f) { if (String(a[f.id] || "").trim()) n++; });
  return "(" + n + "/" + L.length + ")";
}
function ansHtml(r) {
  var sc = window.U7_ANSWERS && window.U7_ANSWERS[$("lesson").value], a = ansOf(r);
  if (!sc) return '<div class="ansv"><div class="sum">This lesson has no typed answers.</div></div>';
  function plain(s) { return String(s || "").replace(/[`*]/g, ""); }
  function one(f) { var v = String(a[f.id] || "").trim(); return '<div class="a1"><div class="k">' + esc(plain(f.q)) + '</div><div class="v' + (v ? "" : " e") + '">' + (v ? esc(v) : "(no answer)") + "</div></div>"; }
  var h = '<div class="ansv"><div class="sum">' + (r.sub ? "Submitted answers" : "Draft answers (not submitted yet)") + " &middot; " + esc(ansSummary(r)) + " answered</div>";
  sc.forEach(function (it) {
    if (it.h) h += "<h3>" + esc(plain(it.h)) + "</h3>";
    else if (it.grp) h += '<div class="g"><b>' + esc(it.grp) + "</b>" + it.fields.map(one).join("") + "</div>";
    else if (it.id) h += one(it);
  });
  return h + "</div>";
}

/* ---------- writing quality ---------- */
function penComment(r) {
  var parts = []; if (r.pasteBad) parts.push("text was copied from outside the editor"); if (r.wq && r.wq.severe) parts.push("the writing is nonsense or the same content repeated");
  return "50% off: " + (parts.length ? parts.join(" and ") : "see the originality notes") + ".";
}
function wqHtml(r) {
  var q = r.wq; if (!q) return "";
  var lvl = q.severe ? "red" : (q.flags.length ? "yellow" : "green");
  var flags = q.flags.map(function (f) { return '<li style="color:' + (f.sev === "high" ? "#FCA5A5" : "#FCD34D") + '">' + esc(f.msg) + "</li>"; }).join("");
  var topic = q.topicWords && q.topicWords.length ? " &middot; topic words: " + esc(q.topicWords.join(", ")) + " (" + (q.topicMentions == null ? "?" : q.topicMentions) + " mentions in paragraphs)" : "";
  return '<div class="org ' + lvl + '"><b class="t">' + LV[lvl] + " Writing check</b>" +
    (q.n < 15 ? "<small>Not enough text to check yet.</small>" : (flags ? "<ul>" + flags + "</ul>" : "<small>Real words, real sentences, and nothing repeated. Looks good.</small>")) +
    '<div class="kv"><span>Words</span><span>' + q.n + "</span><span>Different words</span><span>" + Math.round(q.uniqueRatio * 100) + "%</span><span>Normal sentence words</span><span>" + Math.round(q.stopRatio * 100) + "%</span><span>Nonsense words</span><span>" + q.gibberish + "</span><span>Copied paragraphs</span><span>" + q.dupParas + "</span></div>" +
    (topic ? '<small style="color:var(--soft)">' + topic.replace(/^ &middot; /, "") + "</small>" : "") +
    '<details style="margin-top:8px;font-size:12px;color:var(--soft)"><summary style="cursor:pointer">Grading policy</summary><div style="margin-top:6px;line-height:1.5"><b>Red (severe)</b> = keyboard mashing or nonsense words, filler text (lorem ipsum, asdf), paragraphs of random words with no sentences, the same word over and over, mostly the same few words, copied paragraphs, or the same sentence or phrase repeated many times. Red takes 50% off and also fails the editor checks for real writing. <b>Yellow</b> = a warning only (one repeated sentence, a couple odd words): read it yourself. <b>Topic</b>: the words in the title should show up in the paragraphs. Every flag is a recommendation. You can uncheck the penalty and change the score.</div></details></div>';
}

/* ---------- detail ---------- */
function select(email) {
  selEmail = email; var r = rowsData.filter(function (x) { return x.email === email; })[0]; if (!r) return;
  var penOn = r.teacher ? !!r.teacher.penalty : r.org.penalize;
  var g = r.teacher && r.teacher.score != null ? r.teacher.score : Math.round(r.rep.score * (r.org.penalize ? PENALTY : 1) * 10) / 10;
  var d = $("detail");
  d.innerHTML = '<div class="dhead"><h2>' + esc(r.name) + '</h2><small>' + esc(r.email) + " · Period " + esc(r.period || "?") + " · " + (r.status === "submitted" ? "Submitted " + esc(fmt(r.sub.submittedAt)) : "Draft only (not submitted). Last saved " + esc(fmt(r.draft && r.draft.savedAt))) + '</small><span class="sp"></span><button class="btn sm" id="prevS">◀ Prev</button><button class="btn sm" id="nextS">Next ▶</button></div>' +
    '<div class="dtabs"><button class="btn sm' + (view === "code" ? " on" : "") + '" data-v="code">index.html</button><button class="btn sm' + (view === "css" ? " on" : "") + '" data-v="css">style.css' + (r.css.trim() ? "" : " (empty)") + '</button><button class="btn sm' + (view === "prev" ? " on" : "") + '" data-v="prev">Website</button>' + (window.U7_ANSWERS && window.U7_ANSWERS[$("lesson").value] && window.U7_ANSWER_LEAVES(window.U7_ANSWERS[$("lesson").value]).length ? '<button class="btn sm' + (view === "ans" ? " on" : "") + '" data-v="ans">Answers ' + ansSummary(r) + "</button>" : "") + '</div>' +
    '<div class="dbody"><div class="view" id="view"></div><div class="right" id="right"></div></div>';
  var errLines = {}; r.rep.errors.forEach(function (e) { errLines[e.line] = 1; });
  var lines = r.code.split("\n"), gut = "";
  for (var i = 1; i <= lines.length; i++) gut += '<div' + (errLines[i] ? ' class="err"' : "") + ">" + i + "</div>";
  var v = $("view");
  if (view === "code") { v.innerHTML = '<div class="code"><div class="g">' + gut + "</div><pre></pre></div>"; v.querySelector("pre").innerHTML = r.code ? highlight(r.code, r.org.ranges) : "(empty)"; }
  else if (view === "css") { var cl = (r.css || "").split("\n"), cg = ""; for (var j = 1; j <= cl.length; j++) cg += "<div>" + j + "</div>"; v.innerHTML = '<div class="code"><div class="g">' + cg + "</div><pre></pre></div>"; v.querySelector("pre").textContent = r.css || "(empty: no CSS file)"; }
  else if (view === "ans") { v.innerHTML = ansHtml(r); }
  else { v.innerHTML = '<iframe sandbox="allow-popups" title="Student website"></iframe>'; v.querySelector("iframe").srcdoc = H.previewDoc(r.code, r.css); }
  var nw = "", old = "";
  r.rep.results.forEach(function (x) { var h = '<div class="rule ' + (x.ok ? "ok" : "no") + (x.isNew ? "" : " old") + '"><span class="m">' + (x.ok ? "✓" : "!") + "</span><span>" + esc(x.label) + "</span></div>"; if (x.isNew) nw += h; else old += h; });
  var pr = ""; r.rep.errors.forEach(function (e) { pr += '<div class="prob e"><b>Line ' + e.line + "</b> " + esc(e.msg) + "</div>"; }); r.rep.warnings.forEach(function (w) { pr += '<div class="prob w"><b>Line ' + w.line + "</b> " + esc(w.msg) + "</div>"; });
  var tg = Object.keys(r.rep.tags).sort().map(function (n) { return "<span>&lt;" + esc(n) + "&gt; <b>" + r.rep.tags[n] + "</b></span>"; }).join("");
  var og = r.org, ohtml;
  if (!og.has) ohtml = '<div class="org none"><b class="t">' + LV.none + " No paste data</b>This work was saved before copy/paste tracking, or by an older version of the editor.</div>";
  else {
    var evh = og.events.map(function (x) { return '<div class="ev"><b>' + esc(fmt(new Date(x.e.t).toISOString())) + "</b> · " + x.e.n + " characters, " + x.e.w + " words · " + esc(x.e.file === "css" ? "style.css" : "index.html") + " · " + (x.inFinal ? '<span style="color:#FCA5A5">still in the page</span>' : "not found in final code") + "<code>" + esc(x.e.txt.slice(0, 140)) + (x.e.txt.length > 140 ? "…" : "") + "</code></div>"; }).join("");
    var sh = og.paras.map(function (p) { return '<a target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent('"' + p.q + '"') + '">Search: &ldquo;' + esc(p.q.slice(0, 70)) + '&hellip;&rdquo; (' + p.len + " words)</a>"; }).join("");
    ohtml = '<div class="org ' + og.level + '"><b class="t">' + LV[og.level] + " Originality</b>" + "<ul>" + og.reasons.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul></div>" +
      '<div class="kv"><span>Typed by hand</span><span>' + og.act.typed + '</span><span>Pasted from outside</span><span>' + og.act.ext + '</span><span>Still in the final page</span><span>' + og.inFinal + '</span><span>Active writing time</span><span>' + og.minutes.toFixed(1) + ' min</span><span>Words on the page</span><span>' + og.words + '</span><span>Words per active minute</span><span>' + (og.wpm ? Math.round(og.wpm) : "n/a") + '</span></div>' +
      (evh ? "<h3>Outside pastes</h3>" + evh : "") + (sh ? '<h3>Check a paragraph on the web</h3><div class="srch">' + sh + "</div>" : "");
  }
  $("right").innerHTML = ohtml + wqHtml(r) + '<div class="grade"><h3>Grade</h3><div>Auto check: <span class="big">' + r.rep.score + '</span> / ' + r.rep.total + " <small style=\"color:var(--soft)\">(" + r.rep.passed + "/" + r.rep.count + " checks)</small></div>" +
    '<div style="margin-top:8px">Your score: <input type="number" id="gScore" min="0" step="0.5" value="' + esc(g) + '"> / ' + r.rep.total + '</div><label style="display:flex;gap:6px;align-items:flex-start;margin:6px 0;font-size:12.5px;color:' + (penOn ? '#FCA5A5' : 'var(--soft)') + '"><input type="checkbox" id="gPen"' + (penOn ? " checked" : "") + '> <span><b>50% penalty</b> (copied from outside the editor, or nonsense/repeated writing). Uncheck if you decide it was okay.</span></label><textarea id="gComment" placeholder="Comment for the student (optional)">' + esc(r.teacher ? r.teacher.comment : (penOn ? penComment(r) : "")) + '</textarea>' +
    '<button class="btn pri" id="gSave"' + (r.status !== "submitted" ? " disabled title=\"Only submitted work can be graded\"" : "") + '>Save grade</button> <span id="gInfo" style="color:var(--soft);font-size:12px">' + (r.teacher && r.teacher.gradedAt ? "Saved " + esc(fmt(r.teacher.gradedAt)) : "") + "</span></div>" +
    "<h3>This lesson's requirements</h3>" + (nw || "<small>None</small>") + (old ? '<h3>Carried over</h3>' + old : "") + "<h3>Problems</h3>" + (pr || "<small>None</small>") + "<h3>Tags used</h3><div class=\"chips\">" + (tg || "<small>None</small>") + "</div>";
  $("gPen").onchange = function () { $("gScore").value = Math.round(r.rep.score * (this.checked ? PENALTY : 1) * 10) / 10; if (this.checked && !$("gComment").value.trim()) $("gComment").value = penComment(r); };
  $("gSave").onclick = function () {
    var sc = $("gScore").value; this.disabled = true;
    api({ action: "adminGrade", lesson: $("lesson").value, email: r.email, score: sc, comment: $("gComment").value, penalty: $("gPen").checked }).then(function (j) {
      $("gSave").disabled = false;
      if (j.ok) { r.teacher = j.teacher; toast("Saved"); $("gInfo").textContent = "Saved " + fmt(j.teacher.gradedAt); render(); } else toast(j.error || "Error");
    });
  };
  $("prevS").onclick = function () { step(-1); }; $("nextS").onclick = function () { step(1); };
  [].forEach.call(d.querySelectorAll(".dtabs button"), function (b) { b.onclick = function () { view = b.getAttribute("data-v"); select(email); }; });
  render();
}
function step(dir) { var a = visible(), i = a.map(function (x) { return x.email; }).indexOf(selEmail); var n = a[i + dir]; if (n) select(n.email); }
document.addEventListener("keydown", function (e) { if (/INPUT|TEXTAREA|SELECT/.test((e.target.tagName || ""))) return; if (e.key === "ArrowDown" || e.key === "ArrowRight") step(1); if (e.key === "ArrowUp" || e.key === "ArrowLeft") step(-1); });

/* ---------- export + bulk ---------- */
$("csv").onclick = function () {
  var lesson = $("lesson").value, out = [["Name", "Email", "Period", "Lesson", "Status", "Submitted", "Auto score", "Originality", "Penalty applied", "Teacher score", "Comment"]];
  visible().forEach(function (r) { out.push([r.name, r.email, r.period, lesson, r.status, r.sub ? r.sub.submittedAt : "", r.rep.score, r.org.level, r.teacher ? (r.teacher.penalty ? "yes" : "no") : (r.org.penalize ? "suggested" : ""), r.teacher && r.teacher.score != null ? r.teacher.score : "", r.teacher ? r.teacher.comment : ""]); });
  var csv = out.map(function (row) { return row.map(function (c) { c = String(c == null ? "" : c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(","); }).join("\n");
  var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = "unit7-" + lesson + "-grades.csv"; a.click();
};
$("bulk").onclick = function () {
  var todo = visible().filter(function (r) { return r.status === "submitted" && !(r.teacher && r.teacher.score != null); });
  if (!todo.length) { toast("Nothing to fill in"); return; }
  if (!confirm("Give " + todo.length + " ungraded submission(s) their auto score as the teacher score? You can still change any of them.")) return;
  var lesson = $("lesson").value, i = 0;
  (function next() {
    if (i >= todo.length) { toast("Done"); render(); return; }
    var r = todo[i++]; $("count").textContent = "Saving " + i + " of " + todo.length + "…";
    api({ action: "adminGrade", lesson: lesson, email: r.email, score: Math.round(r.rep.score * (r.org.penalize ? PENALTY : 1) * 10) / 10, comment: r.org.penalize ? penComment(r) : (r.teacher ? r.teacher.comment : ""), penalty: r.org.penalize }).then(function (j) { if (j.ok) r.teacher = j.teacher; next(); });
  })();
};
</script>
</body>
</html>
