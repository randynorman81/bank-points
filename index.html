<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank Points</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div id="site-header-root"></div>

<main>
  <div class="hero">
    <h2>Extra Credit Points Bank</h2>
    <p>Choose your class period above to see your points, or use the button below to request spending points on an assignment.</p>
    <a class="btn btn-primary" href="request.html">Request to Use Points</a>
  </div>

  <div id="class-grid" class="class-grid"></div>
</main>

<footer class="site-footer">
  Bank Points &middot; questions? see Mr. Norman
</footer>

<script src="assets/api.js"></script>
<script src="assets/nav.js"></script>
<script>
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function renderClassGrid() {
  const grid = document.getElementById('class-grid');
  try {
    const data = await apiGet('list');
    const students = data.students || [];
    const periods = sortPeriods([...new Set(students.map(s => s.period))]);
    if (periods.length === 0) {
      grid.innerHTML = '';
      return;
    }
    grid.innerHTML = periods
      .map(p => `<a href="class.html?period=${encodeURIComponent(p)}">${escapeHtml(p)}</a>`)
      .join('');
  } catch (err) {
    grid.innerHTML = '';
  }
}

renderHeader(null);
renderClassGrid();
</script>
</body>
</html>
