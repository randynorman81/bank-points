<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arduino Circuit Editor | SCHS Computer Science</title>
<link rel="icon" href="../assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0E14;--panel:#121722;--card:#171D2B;--rule:#26304A;--ink:#E8ECF3;--soft:#93A0B8;--acc:#22D3EE;--acc2:#FB923C;--ok:#34D399;--bad:#F87171;--warn:#FBBF24}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Manrope,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:6px;padding:5px 12px;background:var(--panel);border-bottom:1px solid var(--rule);flex-wrap:wrap}
.top h1{font-size:13px;margin:0 6px 0 0;letter-spacing:.02em;white-space:nowrap}
.top .sp{flex:1}
.btn,select{background:var(--card);color:var(--ink);border:1px solid var(--rule);border-radius:5px;padding:3px 10px;cursor:pointer;font:700 11.5px Manrope,sans-serif}
.btn:hover,select:hover{border-color:var(--acc)}
.btn.run{background:var(--acc);color:#07131a;border-color:var(--acc)}
.btn.stop{background:#7f1d1d;border-color:#b91c1c;color:#fff}
.btn.go{background:var(--ok);color:#052e1b;border-color:var(--ok)}
.btn.on{border-color:var(--acc);background:#0c2a33;color:#fff}
.btn.sm{padding:2px 8px;font-size:11px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.status{font-size:11px;color:var(--soft);max-width:330px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status.bad{color:var(--bad)}
.saveind{font-size:11px;color:var(--soft)} .saveind.ok{color:#6EE7B7} .saveind.warn{color:#FDE68A} .saveind.bad{color:#FCA5A5}
.who{font-size:11px;color:var(--soft)} .who a{color:var(--acc)}
#gbtn{min-height:0}
.pbtn.on{background:var(--acc);color:#07131a}
.pl{font-size:11px;color:var(--soft)}
main{flex:1;min-height:0;display:grid;grid-template-columns:var(--aw,320px) 6px minmax(0,1fr) 6px var(--cw,420px)}
body.noass main{grid-template-columns:minmax(0,1fr) 6px var(--cw,420px)}
body.noass #paneAss,body.noass #split0{display:none}
.split{background:var(--rule);cursor:col-resize;touch-action:none}.split:hover{background:var(--acc)}
main.dragging{user-select:none}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#paneAss{background:#080B11}
#nameBar{padding:4px 12px;background:#0E1320;border-bottom:1px solid var(--rule)}
#nameBar h2{margin:0;font:700 12px "JetBrains Mono",monospace;letter-spacing:.05em;text-transform:uppercase;color:#67E8F9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#assHead{display:none;align-items:center;gap:6px 14px;flex-wrap:wrap;padding:4px 12px;background:var(--panel);border-bottom:1px solid var(--rule);font:700 12px "JetBrains Mono",monospace;color:var(--soft)}
#assHead.show{display:flex} #assHead b{color:var(--ok)}
#assScore b{font-size:15px;color:var(--acc)}
#assBody{flex:1;overflow:auto;padding:10px 14px 40px;font-size:13.5px}
#assBody h3{margin:16px 0 6px;font:800 13px Manrope,sans-serif;color:#fff;border-top:1px solid var(--rule);padding-top:12px}
#assBody h3:first-of-type{border-top:0;padding-top:0}
#assBody p.intro{color:#C4CDD8;margin:4px 0 10px}
#assBody pre.codebox{background:#05070B;border:1px solid var(--rule);border-radius:7px;padding:9px 12px;margin:6px 0 10px;font:12.5px/1.6 "JetBrains Mono",monospace;color:#E8ECF3;overflow:auto}
#assBody label.item{display:grid;grid-template-columns:20px minmax(0,1fr);gap:4px 9px;align-items:start;margin:6px 0;padding:7px 9px;border:1px solid var(--rule);border-radius:8px;background:var(--card);cursor:default}
#assBody label.item .box{height:18px;border-radius:5px;border:2px solid var(--rule);margin-top:2px;display:grid;place-items:center;font-size:12px;color:transparent}
#assBody label.item.done{border-color:#16794f;background:#0b2a20}
#assBody label.item.done .box{background:var(--ok);border-color:var(--ok);color:#052e1b;font-weight:800}
#assBody label.item .txt{flex:1;color:#DCE4EE}
#assBody label.item .badge{grid-column:2;justify-self:start;font:700 10.5px "JetBrains Mono",monospace;padding:1px 7px;border-radius:99px;border:1px solid var(--rule);color:var(--soft);white-space:nowrap;align-self:flex-start}
#assBody label.item.done .badge{border-color:var(--ok);color:#6EE7B7}
#assBody code{font:12px "JetBrains Mono",monospace;background:#0f1522;padding:0 4px;border-radius:4px;color:#7DD3FC}
.hintbox{margin:10px 0;padding:10px 12px;border:1px dashed #155e75;border-radius:9px;background:#071c24;color:#A5F3FC;font-size:12.5px}
#paneCanvas{background:#0d1118;position:relative}
.ptools{display:flex;gap:5px;align-items:center;padding:5px 8px;background:var(--panel);border-bottom:1px solid var(--rule);flex-wrap:wrap}
.ptools .lbl{font:700 10.5px "JetBrains Mono",monospace;color:var(--soft);letter-spacing:.05em;text-transform:uppercase;margin-right:2px}
.ptools .sep{width:1px;height:20px;background:var(--rule);margin:0 4px}
.pb{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:3px 9px;color:var(--ink);cursor:pointer;font:700 11.5px Manrope,sans-serif}
.pb:hover{border-color:var(--acc);background:#0c2a33}
.pb svg{width:18px;height:18px}
#stagewrap{flex:1;min-height:0;position:relative;overflow:hidden;background:
 radial-gradient(circle at 1px 1px,#1a2230 1px,transparent 1.5px) 0 0/20px 20px,#0d1118}
#stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:default;user-select:none}
#stage.panning{cursor:grabbing}
#stage .part{cursor:grab}
#stage.running .part{cursor:default}
#stage .part[data-type="button"]{cursor:pointer}
#tt{position:fixed;z-index:400;max-width:300px;padding:8px 11px;border-radius:9px;background:#0b1220;border:1px solid #38bdf8;color:#E8ECF3;font-size:12.5px;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none;opacity:0;transition:opacity .08s;left:0;top:0}
#tt.show{opacity:1}
#tt b{color:#fff}
#tt .pol{display:inline-block;font:800 10.5px "JetBrains Mono",monospace;padding:1px 7px;border-radius:99px;margin-left:4px}
#tt .pol.plus{background:#4c0519;color:#fda4af;border:1px solid #fb7185}
#tt .pol.minus{background:#082f49;color:#93c5fd;border:1px solid #60a5fa}
#tt .pol.none{background:#1f2937;color:#cbd5e1;border:1px solid #475569}
#tt .live{color:#86efac}
.pb{touch-action:none;user-select:none}
.tipbtn{display:inline-block;margin:3px 4px 3px 0;padding:2px 10px;border-radius:100px;border:1px solid #FBBF24;background:#2A2110;color:#FDE68A;font:600 12px Manrope,sans-serif;cursor:pointer;line-height:1.5;text-align:left}
.tipbtn:hover,.tipbtn:focus{background:#3a2d12;border-color:#FDE047;outline:0}
.helprow{display:block;margin:4px 0 8px}
.helplbl{font:700 11px "JetBrains Mono",monospace;color:#FCD34D;margin-right:6px;text-transform:uppercase}
.helpstep{display:inline-flex;align-items:center;gap:6px;padding:4px 14px;border-radius:100px;border:1px solid #FBBF24;background:#2A2110;color:#FDE68A;font:700 12.5px Manrope,sans-serif;cursor:pointer}
.helpstep:hover{background:#3a2d12;border-color:#FDE047}.helpstep small{font-weight:600;color:#FCD34D;opacity:.85}
#assBody label.item .helprow{margin:6px 0 0;display:block}
#assBody .tipbtn{font-size:11.5px;padding:1px 9px}
.modal .box.tipbox{max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column;padding:0}
.tiphead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.tiphead h3{margin:0;flex:1;font-size:16px;line-height:1.3}
#tipBody{padding:14px 18px 18px;overflow:auto;font-size:14px;line-height:1.6}
#tipBody p{margin:6px 0 10px}
#tipBody ul,#tipBody ol{margin:6px 0 12px 22px;padding:0}#tipBody li{margin:4px 0}
#tipBody code{font:12.5px "JetBrains Mono",monospace;background:#0f1522;padding:0 5px;border-radius:4px;color:#7DD3FC}
.tipcode{background:#05070B;border:1px solid var(--rule);border-radius:8px;padding:10px 14px;margin:8px 0 12px;font:12.5px/1.6 "JetBrains Mono",monospace;color:#E8ECF3;overflow:auto;white-space:pre}
.tiptbl,.annot{width:100%;border-collapse:collapse;margin:8px 0 14px;font-size:13px}
.tiptbl th{text-align:left;font:700 11px "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.05em;color:#67E8F9;border-bottom:1px solid var(--rule);padding:5px 8px}
.tiptbl td,.annot td{padding:6px 8px;border-bottom:1px solid #1d2638;vertical-align:top}
.annot td:first-child{width:46%}.annot .cl{display:block;white-space:pre;background:#05070B;color:#E8ECF3;padding:3px 8px;border-radius:5px}
.tipgood{margin:10px 0;padding:9px 12px;border:1px solid #14532d;border-radius:9px;background:#07241a;color:#A7F3D0}
.tipwarn{margin:10px 0;padding:9px 12px;border:1px solid #7f1d1d;border-radius:9px;background:#2a0f0f;color:#FECACA}
.tipsvg{margin:8px 0 12px}.tiplinks{margin:12px 0 4px}.tipfoot{margin-top:16px;padding-top:10px;border-top:1px solid var(--rule)}
.helplist{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 12px}
.tipcat{margin:14px 0 4px;font:700 12px "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:#67E8F9}
.tipsearch{width:100%;background:#05070B;color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;font:14px Manrope,sans-serif;margin-bottom:6px}
#hint{position:absolute;left:10px;bottom:10px;max-width:60%;padding:5px 10px;border-radius:8px;background:rgba(7,19,26,.88);border:1px solid #155e75;color:#A5F3FC;font-size:12px;pointer-events:none;opacity:0;transition:opacity .2s}
#hint.show{opacity:1}
#warnbox{position:absolute;right:10px;top:10px;max-width:46%;display:flex;flex-direction:column;gap:5px;pointer-events:none}
#warnbox div{background:rgba(63,18,18,.92);border:1px solid #b91c1c;color:#FECACA;border-radius:8px;padding:5px 9px;font-size:12px}
#warnbox div.tip{background:rgba(7,19,26,.92);border-color:#155e75;color:#A5F3FC}
#props{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:5px 10px;background:var(--panel);border-top:1px solid var(--rule);min-height:34px;font-size:12px}
#props .sw{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
#props .sw.on{border-color:#fff}
#pinbar{display:flex;gap:3px;flex-wrap:wrap;padding:4px 8px;background:#0a0d14;border-top:1px solid var(--rule);font:10.5px "JetBrains Mono",monospace;min-height:26px}
#pinbar span{padding:1px 5px;border-radius:4px;background:#161c28;color:#6b7a99}
#pinbar span.hi{background:#4a3410;color:#fde68a} #pinbar span.pw{background:#3b2a52;color:#e9d5ff} #pinbar span.in{background:#0f2a3a;color:#7dd3fc} #pinbar span.lo{background:#16202c;color:#9fb0cc}
#paneCode{background:#080B11}
.cbar{display:flex;align-items:center;gap:6px;padding:4px 10px;background:#0E1320;border-bottom:1px solid var(--rule)}
.cbar h2{margin:0;font:700 12px "JetBrains Mono",monospace;letter-spacing:.05em;text-transform:uppercase;color:#67E8F9;flex:1}
.edwrap{flex:1 1 55%;min-height:140px;display:flex;position:relative;overflow:hidden;background:#05070B}
#gut{margin:0;padding:10px 6px 10px 8px;text-align:right;color:#4b5a78;font:13px/20px "JetBrains Mono",monospace;background:#070a10;border-right:1px solid var(--rule);user-select:none;overflow:hidden;min-width:38px}
#gut b{color:#F87171;font-weight:700}
.edbox{position:relative;flex:1;min-width:0}
#marks{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;overflow:hidden}
#marksIn{position:relative}
#marksIn div{position:absolute;left:0;right:0;height:20px;background:rgba(248,113,113,.18);border-left:3px solid #F87171}
#marksIn div.w{background:rgba(251,191,36,.12);border-left-color:#FBBF24}
#hl,#ta{position:absolute;inset:0;margin:0;padding:10px 12px;font:13px/20px "JetBrains Mono",monospace;white-space:pre;tab-size:2;overflow:auto;border:0;outline:0;resize:none;background:transparent;letter-spacing:0}
#hl{color:#E8ECF3;pointer-events:none;overflow:hidden}
#ta{color:transparent;caret-color:#fff;-webkit-text-fill-color:transparent}
#ta::selection{background:rgba(34,211,238,.28);-webkit-text-fill-color:transparent}
.k{color:#C084FC}.t{color:#7DD3FC}.f{color:#FDBA74}.c{color:#64748B;font-style:italic}.s{color:#86EFAC}.n{color:#FCD34D}.q{color:#F9A8D4}
#errbox{display:none;padding:8px 12px;background:#2a0f0f;border-top:1px solid #7f1d1d;color:#FECACA;font-size:12.5px;max-height:120px;overflow:auto}
#errbox.show{display:block}#errbox.okmsg{background:#07241a;border-color:#14532d;color:#A7F3D0}#errbox.warnmsg{background:#2a2108;border-color:#854d0e;color:#FDE68A}
#errbox b{color:#fff}
.serial{flex:1 1 38%;min-height:110px;display:flex;flex-direction:column;border-top:1px solid var(--rule);background:#05070B}
.serial .cbar h2{color:#FDBA74}
#out{flex:1;margin:0;padding:8px 12px;overflow:auto;font:12.5px/1.45 "JetBrains Mono",monospace;color:#d1fae5;white-space:pre-wrap;word-break:break-all}
.sendrow{display:flex;gap:6px;padding:6px 8px;border-top:1px solid var(--rule);background:#0b0f18}
.sendrow input{flex:1;background:#05070B;color:var(--ink);border:1px solid var(--rule);border-radius:5px;padding:4px 8px;font:12.5px "JetBrains Mono",monospace}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.show{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:18px 20px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0c2a33;border:1px solid var(--acc);color:#E8ECF3;padding:7px 14px;border-radius:8px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:200}
#toast.show{opacity:1}
.teach{display:none;margin:8px 0;padding:10px 12px;border:1px solid #14532d;border-radius:9px;background:#07241a;color:#A7F3D0;font-size:12.5px}.teach.show{display:block}
@media(max-width:900px){main{grid-template-columns:1fr !important;grid-auto-rows:minmax(300px,auto);overflow:auto}.split{display:none}body{overflow:auto}}
</style></head>
<body>
<div class="top">
  <h1>&#9889; Arduino Circuit Editor</h1>
  <button class="btn run" id="run" title="Run the program on the simulated Arduino">&#9654; Start Simulation</button>
  <button class="btn" id="helpBtn" title="Open the help center">&#128161; Help</button>
  <button class="btn" id="reset" title="Stop and start again (burned LEDs are replaced)">&#8635; Reset</button>
  <select id="speed" aria-label="Speed" title="Simulation speed"><option value="1">1x speed</option><option value="2">2x</option><option value="5">5x</option><option value="10">10x</option></select>
  <select id="slot" aria-label="Assignment"></select>
  <button class="btn on" id="assBtn" title="Show or hide the instructions">Instructions</button>
  <span class="status" id="status">Ready</span>
  <span class="sp"></span>
  <span class="saveind" id="saveInd"></span><span class="who" id="who"></span><span id="gbtn"></span>
  <span id="periodBtns" role="group" aria-label="Class period"><span class="pl">Period:</span> <button type="button" class="btn pbtn" data-p="3A">3A</button> <button type="button" class="btn pbtn" data-p="3B">3B</button> <button type="button" class="btn pbtn" data-p="4A">4A</button></span>
  <button class="btn go" id="submit">Submit</button>
</div>
<main id="main">
  <section class="pane" id="paneAss">
    <div id="nameBar"><h2 id="assTitle">Free build</h2></div>
    <div id="assHead"><div id="assCount"></div><div id="assScore"></div></div>
    <div id="assBody"></div>
  </section>
  <div class="split" id="split0" role="separator" aria-orientation="vertical" tabindex="0" title="Drag to resize. Double-click to reset."></div>
  <section class="pane" id="paneCanvas">
    <div class="ptools" id="ptools">
      <span class="lbl" title="Click a part, HOLD the mouse button, and drag it onto the breadboard">Drag onto the board &#10140;</span>
      <button class="pb" data-add="led" title="LED"><svg viewBox="0 0 24 24"><path d="M6 14V8a6 6 0 0 1 12 0v6z" fill="#ef4444" fill-opacity=".7" stroke="#ef4444" stroke-width="1.5"/><path d="M5 14h14M9 14v7M15 14v5" stroke="#cbd5e1" stroke-width="1.6"/></svg>LED</button>
      <button class="pb" data-add="resistor" title="Resistor"><svg viewBox="0 0 24 24"><path d="M1 12h4M19 12h4" stroke="#cbd5e1" stroke-width="1.8"/><rect x="5" y="8" width="14" height="8" rx="3" fill="#d9c28f" stroke="#a88f55"/><path d="M9 8v8M12 8v8M15 8v8" stroke="#7c3aed"/></svg>Resistor</button>
      <button class="pb" data-add="button" title="Pushbutton"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3" fill="#1f2937" stroke="#0b1220"/><circle cx="12" cy="12" r="5.5" fill="#9ca3af" stroke="#4b5563" stroke-width="1.5"/></svg>Button</button>
      <button class="pb" data-add="buzzer" title="Piezo buzzer"><svg viewBox="0 0 24 24"><circle cx="12" cy="11" r="8" fill="#111827" stroke="#374151" stroke-width="1.5"/><circle cx="12" cy="11" r="2" fill="#374151"/><path d="M8 19v3M16 19v3" stroke="#cbd5e1" stroke-width="1.6"/></svg>Buzzer</button>
      <button class="pb" data-add="breadboard-mini" title="Small breadboard">Mini board</button>
      <button class="pb" data-add="breadboard" title="Half-size breadboard">Breadboard</button>
      <span class="sep"></span>
      <button class="pb" id="undo" title="Undo (Ctrl+Z)">&#8630;</button><button class="pb" id="redo" title="Redo (Ctrl+Y)">&#8631;</button>
      <button class="pb" id="rotate" title="Rotate the selected part (R)">&#10227; Rotate</button>
      <button class="pb" id="delete" title="Delete the selected part or wire (Delete)">&#128465; Delete</button>
      <span class="sep"></span>
      <button class="pb" id="zin" title="Zoom in">+</button><button class="pb" id="zout" title="Zoom out">&minus;</button><button class="pb" id="zfit" title="Fit everything on screen">Fit</button>
      <button class="pb" id="clearc" title="Remove all your parts and wires">Clear circuit</button>
    </div>
    <div id="stagewrap">
      <svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="hint"></div>
      <div id="warnbox"></div>
    </div>
    <div id="props"></div>
    <div id="pinbar" title="Live pin states: orange = HIGH, purple = PWM, blue = input"></div>
  </section>
  <div class="split" id="split1" role="separator" aria-orientation="vertical" tabindex="0" title="Drag to resize. Double-click to reset."></div>
  <section class="pane" id="paneCode">
    <div class="cbar"><h2 id="codeTitle">Your code (sketch.ino)</h2><button class="btn sm" id="codeGuide" title="What goes in setup() and loop(), and every function explained">&#128216; Code guide</button><button class="btn sm" id="starter" title="Put the blank starter code back">Blank sketch</button></div>
    <div class="edwrap"><pre id="gut">1</pre><div class="edbox"><div id="marks" aria-hidden="true"><div id="marksIn"></div></div><pre id="hl" aria-hidden="true"></pre><textarea id="ta" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Arduino code"></textarea></div></div>
    <div id="errbox"></div>
    <div class="teach" id="teach"></div>
    <div class="serial"><div class="cbar"><h2>Serial Monitor</h2><button class="btn sm" id="clearOut">Clear</button></div><pre id="out"></pre>
      <div class="sendrow"><input id="serIn" placeholder="Type here and press Enter to send to the Arduino" aria-label="Send to serial"><button class="btn sm" id="serSend">Send</button></div></div>
  </section>
</main>
<div class="modal" id="mSub"><div class="box"><div id="mSubBody"></div><div class="row"><button class="btn" id="mCancel">Cancel</button><button class="btn go" id="mGo">Submit</button></div></div></div>
<div class="modal" id="mTip"><div class="box tipbox" role="dialog" aria-label="Help"><div class="tiphead"><button class="btn sm" id="tipBack" type="button">&larr; Back</button><h3 id="tipTitle"></h3><button class="btn" id="tipClose" type="button">Got it</button></div><div id="tipBody"></div></div></div>
<div id="tt"></div>
<div id="toast"></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="compiler.js"></script>
<script src="circuit.js"></script>
<script src="sim.js"></script>
<script src="render.js"></script>
<script src="tips.js"></script>
<script src="assignments.js"></script>
<script src="editor.js"></script>
</body></html>
