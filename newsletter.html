<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newsletter | SCHS Computer Science</title>
<meta name="description" content="Updates for parents on what's happening in Intro to Software Technology, AP Computer Science Principles, and Embedded Computing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="assets/logo.png">
</head>
<body>

<div id="site-header-root"></div>

<main id="newsletter-main">
  <div id="newsletter-slot" class="loading">Loading&hellip;</div>
</main>

<footer class="site-footer">
  Social Circle High School &middot; Computer Science
</footer>

<script src="assets/api.js"></script>
<script src="assets/nav.js"></script>
<script>
renderHeader({ current: "newsletter" });

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

function formatDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  return d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
}

// The Admin compose form assembles a post's body as labeled sections (see
// newsletter-admin.html). This renders those sections as actual headings
// instead of plain uppercase text. A post from before that feature existed
// (or any body that doesn't match) just falls back to one plain block.
const SECTION_HEADINGS = [
  { heading: 'ANNOUNCEMENTS', label: 'Announcements' },
  { heading: 'IMPORTANT LINKS', label: 'Important Links' },
  { heading: 'UNIT TEST', label: 'Unit Test' },
  { heading: 'WORLDWIDE NEWS CONNECTED TO OUR CONTENT', label: 'Worldwide News Connected to Our Content' }
];
const escapeRegex = (str) => str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

// Runs on already-escaped text, so it's safe to insert an <a> around a URL
// without any risk of the URL text itself containing live HTML. Trims
// trailing sentence punctuation off the link so "...see https://x.com."
// doesn't pull the period into the href.
function linkify(escapedText) {
  return escapedText.replace(/(https?:\/\/[^\s<]+)/g, (url) => {
    let trail = '';
    let clean = url;
    while (clean && /[.,;:!?)]$/.test(clean)) {
      trail = clean.slice(-1) + trail;
      clean = clean.slice(0, -1);
    }
    return `<a href="${clean}" target="_blank" rel="noopener">${clean}</a>${trail}`;
  });
}

function formatBody(body) {
  const headingPattern = SECTION_HEADINGS.map(s => escapeRegex(s.heading)).join('|');
  let matchedAny = false;
  const sectionsHtml = SECTION_HEADINGS.map(s => {
    const re = new RegExp(escapeRegex(s.heading) + '\\n([\\s\\S]*?)(?=\\n(?:' + headingPattern + ')\\n|$)');
    const m = body.match(re);
    const val = m ? m[1].trim() : '';
    if (!val) return '';
    matchedAny = true;
    return `<div class="post-section"><h4>${escapeHtml(s.label)}</h4><p>${linkify(escapeHtml(val))}</p></div>`;
  }).join('');
  return matchedAny ? sectionsHtml : `<p class="post-body">${linkify(escapeHtml(body))}</p>`;
}

function getParams() {
  const params = new URLSearchParams(location.search);
  return { course: params.get('course') || '', post: params.get('post') || '' };
}

function coursePickerHtml() {
  return `
    <h2 style="margin-top:0;">Newsletter</h2>
    <p class="hint" style="margin-top:-8px; margin-bottom:20px;">Choose a class to see its weekly updates.</p>
    <div class="course-grid">
      ${COURSES.map(c => `
        <a class="course-card" href="newsletter.html?course=${encodeURIComponent(c.id)}">
          <div class="body">
            <p class="eyebrow">Newsletter</p>
            <h3>${escapeHtml(c.name)}</h3>
            <div class="go">See updates &rarr;</div>
          </div>
        </a>
      `).join('')}
    </div>
  `;
}

function postCardHtml(p) {
  return `
    <div class="card post-card">
      <p class="post-date">${escapeHtml(formatDate(p.date))}</p>
      <h3>${escapeHtml(p.title)}</h3>
      ${formatBody(p.body)}
    </div>
  `;
}

async function renderNewsletter() {
  const slot = document.getElementById('newsletter-slot');
  const { course, post } = getParams();

  if (!course) {
    slot.innerHTML = coursePickerHtml();
    return;
  }

  const courseInfo = COURSES.find(c => c.id === course);
  if (!courseInfo) {
    slot.innerHTML = coursePickerHtml();
    return;
  }

  slot.innerHTML = `<p class="loading">Loading&hellip;</p>`;

  let posts;
  try {
    const res = await apiGet('list');
    posts = (res.posts || []).filter(p => p.course === course);
  } catch (err) {
    slot.innerHTML = '<div class="alert alert-error">Could not load the newsletter. Please try again in a moment.</div>';
    return;
  }

  const backLink = `<a class="breadcrumb" href="newsletter.html">&larr; Choose a different class</a>`;

  if (post) {
    const match = posts.find(p => p.id === post);
    if (!match) {
      slot.innerHTML = `${backLink}<h2>${escapeHtml(courseInfo.name)} Newsletter</h2><p class="hint">That update couldn't be found.</p>`;
      return;
    }
    slot.innerHTML = `
      ${backLink}
      <h2 style="margin-bottom:4px;">${escapeHtml(courseInfo.name)} Newsletter</h2>
      <p class="hint" style="margin-top:0; margin-bottom:20px;"><a href="newsletter.html?course=${encodeURIComponent(course)}">&larr; Back to all ${escapeHtml(courseInfo.shortName)} updates</a></p>
      ${postCardHtml(match)}
    `;
    return;
  }

  if (posts.length === 0) {
    slot.innerHTML = `${backLink}<h2>${escapeHtml(courseInfo.name)} Newsletter</h2><p class="hint">No updates posted yet — check back soon.</p>`;
    return;
  }

  const [latest, ...older] = posts;
  const archiveHtml = older.length === 0 ? '' : `
    <h3 style="margin-bottom:8px;">Previous Updates</h3>
    <div class="card">
      ${older.map(p => `
        <div class="post-list-item">
          <a href="newsletter.html?course=${encodeURIComponent(course)}&post=${encodeURIComponent(p.id)}">
            <span class="title">${escapeHtml(p.title)}</span>
            <span class="sub">${escapeHtml(formatDate(p.date))}</span>
          </a>
        </div>
      `).join('')}
    </div>
  `;

  slot.innerHTML = `
    ${backLink}
    <h2 style="margin-bottom:20px;">${escapeHtml(courseInfo.name)} Newsletter</h2>
    ${postCardHtml(latest)}
    ${archiveHtml}
  `;
}

renderNewsletter();
</script>
</body>
</html>
