<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parsons Puzzles and Code Tracing | SCHS Computer Science</title>
<link rel="icon" href="../assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9EDF4;--card:#fff;--ink:#1E293B;--hi:#0F172A;--soft:#64748B;--rule:#D7DEEA;--acc:#4F46E5;--accl:#EEF0FF;--ok:#16A34A;--okl:#DCFCE7;--bad:#DC2626;--badl:#FEE2E2;--warn:#B45309;--warnl:#FEF3C7;--head:#0F172A;--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
svg.i{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{background:var(--head);color:#F8FAFC;border-bottom:3px solid var(--acc);padding:10px clamp(12px,3vw,40px);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top .brand{font-weight:800;font-size:18px}
.badge{font:600 11px Inter;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:99px;border:1px solid #475569;color:#CBD5E1}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:99px;border:1px solid #475569;background:#1E293B;color:#F8FAFC;text-decoration:none;font-weight:600;font-size:13px}
.pill:hover{border-color:var(--acc)}
.sp{flex:1}
.wrap{max-width:1500px;margin:0 auto;padding:18px clamp(12px,3vw,40px) 60px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.tab{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:12px;border:1px solid var(--rule);background:#fff;color:var(--hi);font-weight:600;font-size:13.5px;text-decoration:none}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tab small{font-weight:500;color:var(--soft)}.tab.on small{color:#E0E7FF}
.tab.done::after{content:"\2713";color:var(--ok);font-weight:800;margin-left:2px}.tab.on.done::after{color:#BBF7D0}
.card{background:var(--card);border:1px solid var(--rule);border-radius:16px;box-shadow:0 2px 8px rgba(15,23,42,.06);overflow:hidden;margin:0 0 16px}
.ch{display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(90deg,#EEF0FF,#fff 75%);border-bottom:1px solid #E5EAF3}
.ch h2{margin:0;font-size:16px;font-weight:800;color:var(--hi);flex:1}
.num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.pillst{font:700 11px Inter;padding:4px 11px;border-radius:99px;background:#E2E8F0;color:#475569}.pillst.ok{background:var(--okl);color:#166534}
.cb{padding:14px 16px}
.goal{background:var(--accl);border:1px solid #C7D2FE;border-radius:12px;padding:10px 14px;margin:0 0 12px;color:var(--hi);font-weight:600}
.goal span,.lab{display:block;font:800 10px Inter;letter-spacing:.1em;color:var(--acc);margin-bottom:2px}
.term{background:#0B1220;border-radius:12px;overflow:hidden;margin:0 0 14px}
.term .bar{display:flex;align-items:center;gap:6px;padding:7px 12px;background:#1E293B}
.term .bar i{width:10px;height:10px;border-radius:50%;background:#EF4444;display:inline-block}.term .bar i:nth-child(2){background:#F59E0B}.term .bar i:nth-child(3){background:#22C55E}
.term .bar span{margin-left:8px;font:700 11px Inter;letter-spacing:.06em;text-transform:uppercase;color:#94A3B8}
.term pre{margin:0;padding:10px 14px 12px;color:#86EFAC;font:12.5px/1.6 var(--mono);white-space:pre-wrap}
.term pre u{text-decoration:none;color:#7DD3FC;display:block}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.col h3{margin:0 0 6px;font:800 11px Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);display:flex;align-items:center;gap:6px}
.list{min-height:120px;border:2px dashed #CBD5E1;border-radius:14px;padding:8px;background:#F8FAFC;counter-reset:ln}
.list.prog{background:#0B1220;border:2px solid #1E293B}
.list .hint{color:#64748B;font-size:13px;padding:8px}
.piece{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #CBD5E1;border-radius:10px;padding:9px 11px;margin:0 0 7px;font:13.5px var(--mono);color:#0F172A;cursor:grab;touch-action:manipulation;user-select:none;-webkit-user-select:none;word-break:break-word}
.piece:active{cursor:grabbing}
.piece .g{color:#94A3B8;flex:none}
.prog .piece{background:#1E293B;border-color:#334155;color:#E2E8F0;counter-increment:ln}
.prog .piece::before{content:counter(ln);flex:none;width:18px;text-align:right;color:#64748B;font-size:12px}
.prog .piece .g{color:#64748B}
.piece.ok{background:#064E3B!important;border-color:#34D399!important}
.piece.no{background:#7F1D1D!important;border-color:#F87171!important}
.piece.ghost{opacity:.4}
.msg{margin:12px 0 0;padding:10px 14px;border-radius:12px;font-weight:600;font-size:14px;display:none}
.msg.show{display:block}.msg.ok{background:var(--okl);color:#166534}.msg.bad{background:var(--badl);color:#991B1B}.msg.info{background:var(--warnl);color:#92400E}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:99px;border:1px solid #CBD5E1;background:#fff;color:var(--hi);font-weight:700;font-size:14px}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.go{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 3px 10px rgba(79,70,229,.35)}
.btn.go:hover{filter:brightness(1.1);color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}
.meter{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--hi);margin:0 0 14px;flex-wrap:wrap}
.meter .bar{flex:1;min-width:140px;height:10px;border-radius:99px;background:#CBD5E1;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
/* tracing */
.tr{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.tr{grid-template-columns:1fr}}
.code{background:#0B1220;border-radius:12px;padding:8px 0;font:13.5px/1.9 var(--mono);color:#E2E8F0;overflow-x:auto}
.code div{display:flex;gap:12px;padding:0 14px;white-space:pre}
.code div b{color:#64748B;font-weight:500;width:18px;text-align:right;flex:none}
.code div.cur{background:#3730A3}.code div.cur b{color:#C7D2FE}
.code div.past{opacity:.55}
table.vt{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--rule);border-radius:12px;overflow:hidden;font-size:14px}
table.vt th{background:#EEF0FF;color:var(--hi);font:800 10.5px Inter;letter-spacing:.07em;text-align:left;padding:8px 12px;border-bottom:1px solid var(--rule);text-transform:uppercase}
table.vt td{padding:7px 12px;border-bottom:1px solid #EDF1F7;font-family:var(--mono)}
table.vt tr:last-child td{border-bottom:0}
table.vt td.old{color:#64748B}
input.ans{width:100%;max-width:200px;padding:7px 10px;border:2px solid #CBD5E1;border-radius:10px;font:14px var(--mono);color:#0F172A;background:#fff}
input.ans:focus{outline:none;border-color:var(--acc)}
input.ans.ok{border-color:var(--ok);background:var(--okl)}input.ans.no{border-color:var(--bad);background:var(--badl)}
.say{margin:0 0 10px;color:#334155}
.note{font-size:13px;color:var(--soft);margin-top:10px}
.conf{font-size:44px;text-align:center}
</style>
</head>
<body>
<div class="top">
  <span class="brand">Python Editor</span><span class="badge" id="badge">Practice</span><span class="sp"></span>
  <a class="pill" id="backEd" href="editor.html"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6l6 6"/></svg>Back to the editor</a>
</div>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div id="main"></div>
</div>
<script src="parsons-u3.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
var D = window.PARSONS || { lessons: {}, traces: {} }, Q = new URLSearchParams(location.search), $ = function (id) { return document.getElementById(id); };
var ICON = { puzzle: '<svg class="i" viewBox="0 0 24 24"><path d="M4 7h3a1 1 0 0 0 1 -1v-1a2 2 0 0 1 4 0v1a1 1 0 0 0 1 1h3a1 1 0 0 1 1 1v3a1 1 0 0 0 1 1h1a2 2 0 0 1 0 4h-1a1 1 0 0 0 -1 1v3a1 1 0 0 1 -1 1h-3a1 1 0 0 1 -1 -1v-1a2 2 0 0 0 -4 0v1a1 1 0 0 1 -1 1h-3a1 1 0 0 1 -1 -1v-3a1 1 0 0 1 1 -1h1a2 2 0 0 0 0 -4h-1a1 1 0 0 1 -1 -1v-3a1 1 0 0 1 1 -1"/></svg>',
  route: '<svg class="i" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M12 19h4.5a3.5 3.5 0 0 0 0 -7h-8a3.5 3.5 0 0 1 0 -7h3.5"/></svg>',
  grip: '<svg class="i g" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="18" r="1"/></svg>',
  check: '<svg class="i" viewBox="0 0 24 24"><path d="M5 12l5 5l10 -10"/></svg>', undo: '<svg class="i" viewBox="0 0 24 24"><path d="M9 14l-4 -4l4 -4"/><path d="M5 10h11a4 4 0 1 1 0 8h-1"/></svg>', next: '<svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6l-6 6"/></svg>' };
function esc(t) { return String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function ls(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || "null"); localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} return null; }
var LESS = Object.keys(D.lessons), mode = Q.get("t") ? "trace" : "parsons", lid = Q.get("l") && D.lessons[Q.get("l")] ? Q.get("l") : LESS[0], unit = Q.get("t") || "3";
function lessonScore(id) { var L = D.lessons[id], st = ls("py:parsons:" + id) || {}, s = 0; L.problems.forEach(function (p, i) { s += (st[i] && st[i].best) || 0; }); return Math.round(s / L.problems.length); }
function lessonDone(id) { var L = D.lessons[id], st = ls("py:parsons:" + id) || {}; return L.problems.every(function (p, i) { return st[i] && st[i].done; }); }
function tabs() {
  var h = LESS.map(function (id) { var L = D.lessons[id]; return '<a class="tab' + (mode === "parsons" && id === lid ? " on" : "") + (lessonDone(id) ? " done" : "") + '" href="?l=' + id + '">' + ICON.puzzle + L.num + '</a>'; }).join("");
  h += '<a class="tab' + (mode === "trace" ? " on" : "") + '" href="?t=3">' + ICON.route + 'Code tracing <small>Unit 3</small></a>';
  $("tabs").innerHTML = h;
}

/* ---------------- Parsons ---------------- */
var cur = 0, sortables = [], tries = 0, solved = false;
function sameText(a, b) { return a === b; }
function grade(placed, P) {
  var sol = P.sol, N = sol.length, ok = new Array(placed.length), pos, all = placed.length === N;
  placed.forEach(function (p, i) { ok[i] = !p.d && i < N && p.t === sol[i]; });
  (P.groups || []).forEach(function (g) {   /* lines inside a group may swap places */
    var idx = g.slice().sort(function (a, b) { return a - b; }); if (idx.some(function (i) { return i >= placed.length; })) return;
    var want = idx.map(function (i) { return sol[i]; }).sort().join("\n"), have = idx.map(function (i) { return placed[i].d ? "\u0000" + placed[i].t : placed[i].t; }).sort().join("\n");
    if (want === have) idx.forEach(function (i) { ok[i] = true; });
  });
  var right = ok.filter(Boolean).length, dis = placed.filter(function (p) { return p.d; }).length;
  return { ok: ok, right: right, N: N, dis: dis, full: all && right === N && dis === 0, short: placed.length < N };
}
function pieceEl(p) { var d = document.createElement("div"); d.className = "piece"; d.dataset.t = p.t; if (p.d) d.dataset.d = "1"; d.innerHTML = ICON.grip + "<span>" + esc(p.t) + "</span>"; return d; }
function readProg() { return Array.prototype.map.call($("prog").children, function (e) { return e.classList.contains("piece") ? { t: e.dataset.t, d: !!e.dataset.d } : null; }).filter(Boolean); }
function showParsons() {
  var L = D.lessons[lid], P = L.problems[cur], st = ls("py:parsons:" + lid) || {}, done = st[cur] && st[cur].done;
  tries = 0; solved = false; sortables.forEach(function (s) { s.destroy(); }); sortables = [];
  document.title = "Parsons " + L.num + " | SCHS Computer Science"; $("badge").textContent = "Parsons puzzle · " + L.num;
  var probTabs = L.problems.map(function (p, i) { var d = st[i] && st[i].done; return '<a class="tab' + (i === cur ? " on" : "") + (d ? " done" : "") + '" href="?l=' + lid + '&p=' + i + '">Problem ' + (i + 1) + "</a>"; }).join("");
  var sc = lessonScore(lid);
  $("main").innerHTML = '<div class="meter">Lesson ' + L.num + ': ' + esc(L.title) + '<div class="bar"><i style="width:' + sc + '%"></i></div><span>' + sc + '% <small style="font-weight:500;color:#64748B">of the lesson score</small></span></div><div class="tabs">' + probTabs + "</div>"
    + '<div class="card"><div class="ch"><span class="num">' + (cur + 1) + '</span><h2>' + esc(P.title) + '</h2><span class="pillst' + (done ? " ok" : "") + '" id="pst">' + (done ? "✓ Done" : "To do") + '</span></div><div class="cb">'
    + '<div class="goal"><span>YOUR TASK</span>' + esc(P.story) + "</div>"
    + '<div class="term"><div class="bar"><i></i><i></i><i></i><span>The finished program prints' + (P.ins.length ? " (when the user types " + esc(P.ins.join(", ")) + ")" : "") + "</span></div><pre>" + P.expect.map(esc).join("\n") + "</pre></div>"
    + '<div class="cols"><div class="col"><h3>' + ICON.puzzle + ' Pieces <span style="text-transform:none;letter-spacing:0;font-weight:500">(some are not needed)</span></h3><div class="list" id="pool"></div></div>'
    + '<div class="col"><h3>' + ICON.check + ' Your program</h3><div class="list prog" id="prog"><div class="hint" id="hint">Drag pieces here, or tap a piece to move it. Put them in order.</div></div></div></div>'
    + '<div class="msg" id="msg"></div><div class="btns"><button class="btn go" id="chk">' + ICON.check + 'Check my program</button><button class="btn" id="rst">' + ICON.undo + 'Start over</button><button class="btn go" id="nx" style="display:none">Next ' + ICON.next + "</button></div>"
    + '<div class="note">Tap a piece to move it between the lists. Drag to reorder. Tap a piece in your program to send it back.</div></div></div>';
  var pool = $("pool"), prog = $("prog");
  P.pieces.forEach(function (p) { pool.appendChild(pieceEl(p)); });
  var opts = { group: "p", animation: 150, ghostClass: "ghost", delay: 80, delayOnTouchOnly: true, touchStartThreshold: 4, onSort: hint, onAdd: hint, onRemove: hint };
  sortables.push(Sortable.create(pool, opts), Sortable.create(prog, opts));
  function hint() { var h = $("hint"); if (prog.querySelectorAll(".piece").length) { if (h) h.style.display = "none"; } else if (h) h.style.display = ""; }
  [pool, prog].forEach(function (list) { list.addEventListener("click", function (e) { var el = e.target.closest(".piece"); if (!el || solved) return; el.classList.remove("ok", "no"); (list === pool ? prog : pool).appendChild(el); hint(); $("msg").className = "msg"; }); });
  $("rst").onclick = function () { if (solved) return; Array.prototype.slice.call(prog.querySelectorAll(".piece")).forEach(function (e) { e.classList.remove("ok", "no"); pool.appendChild(e); }); hint(); $("msg").className = "msg"; };
  $("chk").onclick = function () { check(P); };
  if (done) { /* already solved before: show the solved program so they can look at it */ }
}
function check(P) {
  if (solved) return; var placed = readProg(), msg = $("msg");
  if (!placed.length) { msg.className = "msg show info"; msg.textContent = "Move some pieces into your program first."; return; }
  tries++; var g = grade(placed, P), els = $("prog").querySelectorAll(".piece");
  Array.prototype.forEach.call(els, function (e, i) { e.classList.remove("ok", "no"); e.classList.add(g.ok[i] ? "ok" : "no"); });
  if (g.full) {
    solved = true; var pts = Math.max(40, 100 - 15 * (tries - 1)), st = ls("py:parsons:" + lid) || {}; if (!st[cur] || pts > (st[cur].best || 0)) st[cur] = { best: pts, done: true, tries: tries }; else st[cur].done = true; ls("py:parsons:" + lid, st);
    msg.className = "msg show ok"; msg.textContent = (tries === 1 ? "First try! " : "Solved in " + tries + " tries. ") + "That program prints exactly what the ticket asked for. +" + pts + " points on this problem.";
    $("pst").className = "pillst ok"; $("pst").textContent = "✓ Done"; $("chk").disabled = true; $("rst").disabled = true; sortables.forEach(function (s) { s.option("disabled", true); });
    var L = D.lessons[lid], nx = $("nx"); nx.style.display = ""; nx.innerHTML = (cur + 1 < L.problems.length ? "Next problem " : "Finish lesson ") + ICON.next;
    nx.onclick = function () { if (cur + 1 < L.problems.length) { cur++; showParsons(); tabs(); window.scrollTo(0, 0); } else finishLesson(); };
    tabs(); var sc = lessonScore(lid); ls("py:parsons-sum:" + lid, sc); document.querySelector(".meter .bar i").style.width = sc + "%"; document.querySelector(".meter span").firstChild.textContent = sc + "% ";
    return;
  }
  var bits = [];
  if (g.dis) bits.push(g.dis + " piece" + (g.dis > 1 ? "s" : "") + " in your program " + (g.dis > 1 ? "are" : "is") + " not needed (a distractor)");
  if (g.short) bits.push("you are missing " + (g.N - placed.length + 0) + " line" + (g.N - placed.length === 1 ? "" : "s") + (g.dis ? " (after taking out the extras)" : ""));
  var wrongPos = placed.length - g.right - g.dis; if (wrongPos > 0 && !g.short) bits.push(wrongPos + " line" + (wrongPos > 1 ? "s are" : " is") + " in the wrong spot");
  msg.className = "msg show bad"; msg.textContent = g.right + " of " + g.N + " lines are right. " + (bits.length ? bits.join("; ").replace(/^./, function (c) { return c.toUpperCase(); }) + "." : "Keep going.") + " Green means right, red means move it or remove it.";
}
function finishLesson() {
  var L = D.lessons[lid], sc = lessonScore(lid), i = LESS.indexOf(lid), nextId = LESS[i + 1];
  $("main").innerHTML = '<div class="card"><div class="cb" style="text-align:center;padding:30px 16px"><div class="conf">🎉</div><h2 style="margin:6px 0 4px;color:#0F172A">Lesson ' + L.num + ' puzzles complete</h2><p class="say">Your lesson score from these puzzles: <b>' + sc + '%</b></p><div class="btns" style="justify-content:center">'
    + (nextId ? '<a class="btn go" href="?l=' + nextId + '">Next: ' + D.lessons[nextId].num + " " + ICON.next + "</a>" : '<a class="btn go" href="?t=3">Try the code tracing problems ' + ICON.next + "</a>") + '<a class="btn" href="?l=' + lid + '">Review this lesson</a></div></div></div>';
  tabs();
}

/* ---------------- Code tracing ---------------- */
var ti = 0, si = 0, tScore = {};
function norm(s) { return String(s).trim(); }
function same(ans, exp) {   /* exp is a Python repr: 'text' or 14 or 1.5 */
  ans = norm(ans); var m = /^'(.*)'$/.exec(exp); if (m) { return ans === m[1] || ans === "'" + m[1] + "'" || ans === '"' + m[1] + '"'; }
  if (/^-?\d+(\.\d+)?$/.test(exp)) { if (!/^-?\d+(\.\d+)?$/.test(ans)) return false; return ans.indexOf(".") >= 0 === exp.indexOf(".") >= 0 && Number(ans) === Number(exp); }
  return ans === exp;
}
function showTrace() {
  var T = D.traces[unit] || [], tr = T[ti]; mode = "trace"; $("badge").textContent = "Code tracing · Unit " + unit; document.title = "Code tracing | SCHS Computer Science";
  var sc = ls("py:trace:" + unit) || {}, tabsH = T.map(function (t, i) { return '<a class="tab' + (i === ti ? " on" : "") + (sc[i] && sc[i].done ? " done" : "") + '" href="?t=' + unit + "&i=" + i + '">' + ICON.route + "Trace " + (i + 1) + "</a>"; }).join("");
  var tot = 0; T.forEach(function (t, i) { tot += (sc[i] && sc[i].best) || 0; }); tot = Math.round(tot / T.length);
  si = 0; $("main").innerHTML = '<div class="meter">Unit ' + unit + ' code tracing<div class="bar"><i style="width:' + tot + '%"></i></div><span>' + tot + '%</span></div><div class="tabs">' + tabsH + "</div>" + '<div class="card"><div class="ch"><span class="num">' + (ti + 1) + "</span><h2>" + esc(tr.title) + '</h2><span class="pillst" id="tpst">Line 1 of ' + tr.code.length + '</span></div><div class="cb"><p class="say">' + esc(tr.intro) + '</p><div class="tr"><div><div class="lab">CODE</div><div class="code" id="tcode"></div></div><div><div class="lab">VARIABLES AFTER THIS LINE RUNS</div><div id="tvars"></div><div class="msg" id="tmsg"></div><div class="btns"><button class="btn go" id="tchk">' + ICON.check + 'Check</button><button class="btn go" id="tnx" style="display:none">Next line ' + ICON.next + "</button></div></div></div></div></div>";
  tr._wrong = 0; tr._asked = 0; drawStep(tr);
}
function drawStep(tr) {
  var step = tr.steps[si], last = si === tr.steps.length - 1, prevVars = si ? tr.steps[si - 1].vars : {};
  $("tcode").innerHTML = tr.code.map(function (ln, i) { return '<div class="' + (i === si ? "cur" : i < si ? "past" : "") + '"><b>' + (i + 1) + "</b>" + esc(ln) + "</div>"; }).join("");
  $("tpst").textContent = "Line " + (si + 1) + " of " + tr.code.length;
  var names = Object.keys(step.vars), rows = "", ask = [];
  names.forEach(function (n) {
    var chg = step.changed[n] !== undefined;
    if (chg) { ask.push({ n: n, exp: step.changed[n] }); rows += "<tr><td>" + esc(n) + '</td><td><input class="ans" data-n="' + esc(n) + '" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="value?"></td></tr>'; }
    else rows += "<tr><td>" + esc(n) + '</td><td class="old">' + esc(step.vars[n]) + "</td></tr>";
  });
  var printAsk = step.printed && step.printed.length;
  if (printAsk) { rows += '<tr><td>prints</td><td><input class="ans" data-n="__print" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="what shows?"></td></tr>'; }
  if (!names.length && !printAsk) rows = '<tr><td colspan="2" class="old">Nothing has been stored yet.</td></tr>';
  var inputLine = /input\(/.test(tr.code[si]) ? '<div class="note" style="margin:0 0 8px">This line reads from the keyboard. The user types <b>' + esc(tr.ins[0] || "") + "</b>.</div>" : "";
  $("tvars").innerHTML = inputLine + '<table class="vt"><thead><tr><th>Variable</th><th>Value</th></tr></thead><tbody>' + rows + "</tbody></table>";
  var firstIn = document.querySelector("#tvars input"); if (firstIn) firstIn.focus();
  $("tmsg").className = "msg"; $("tnx").style.display = "none"; $("tchk").disabled = false;
  $("tchk").onclick = function () { checkStep(tr, step, ask, printAsk, last); };
  $("tvars").onkeydown = function (e) { if (e.key === "Enter") { e.preventDefault(); if ($("tnx").style.display === "none") $("tchk").click(); else $("tnx").click(); } };
  if (!ask.length && !printAsk) { $("tchk").style.display = "none"; $("tnx").style.display = ""; $("tnx").textContent = ""; $("tnx").innerHTML = (last ? "Finish " : "Next line ") + ICON.next; $("tnx").onclick = function () { advance(tr, last); }; } else $("tchk").style.display = "";
}
function checkStep(tr, step, ask, printAsk, last) {
  var allOk = true, msg = $("tmsg"); tr._asked++;
  ask.forEach(function (a) { var el = document.querySelector('input[data-n="' + a.n + '"]'), ok = same(el.value, a.exp); el.classList.remove("ok", "no"); el.classList.add(ok ? "ok" : "no"); if (!ok) allOk = false; });
  if (printAsk) { var el = document.querySelector('input[data-n="__print"]'), ok = same(el.value, "'" + step.printed.join(" | ") + "'") || norm(el.value) === step.printed.join("\n") || same(el.value, step.printed[0]) && step.printed.length === 1; el.classList.remove("ok", "no"); el.classList.add(ok ? "ok" : "no"); if (!ok) allOk = false; }
  if (!allOk) { tr._wrong++; msg.className = "msg show bad"; msg.textContent = "Not yet. Re-read line " + (si + 1) + " and check what it does to the value (a number with a decimal point is a float, text is a string)."; return; }
  msg.className = "msg show ok"; msg.textContent = "Right."; $("tchk").style.display = "none"; var nx = $("tnx"); nx.style.display = ""; nx.innerHTML = (last ? "Finish " : "Next line ") + ICON.next; nx.onclick = function () { advance(tr, last); };
}
function advance(tr, last) {
  if (!last) { si++; drawStep(tr); return; }
  var pts = Math.max(40, 100 - 12 * tr._wrong), sc = ls("py:trace:" + unit) || {}; if (!sc[ti] || pts > (sc[ti].best || 0)) sc[ti] = { best: pts, done: true }; else sc[ti].done = true; ls("py:trace:" + unit, sc); var TT = D.traces[unit], tsum = 0; TT.forEach(function (t, k) { tsum += (sc[k] && sc[k].best) || 0; }); ls("py:trace-sum:" + unit, Math.round(tsum / TT.length));
  var T = D.traces[unit]; $("main").innerHTML = '<div class="card"><div class="cb" style="text-align:center;padding:30px 16px"><div class="conf">🎯</div><h2 style="margin:6px 0 4px;color:#0F172A">Trace ' + (ti + 1) + " complete</h2><p class=\"say\">The program prints <b style=\"font-family:var(--mono)\">" + esc(tr.steps[tr.steps.length - 1].printed.join(" / ") || "") + "</b>. You scored <b>" + pts + "%</b>" + (tr._wrong ? " (" + tr._wrong + " wrong check" + (tr._wrong > 1 ? "s" : "") + ")" : " with no wrong checks") + '.</p><div class="btns" style="justify-content:center">' + (ti + 1 < T.length ? '<a class="btn go" href="?t=' + unit + "&i=" + (ti + 1) + '">Next trace ' + ICON.next + "</a>" : "") + '<a class="btn" href="?t=' + unit + "&i=" + ti + '">Do it again</a></div></div></div>';
}

  var p = Number(Q.get("p")); if (p >= 0 && p < (D.lessons[lid] || { problems: [] }).problems.length) cur = p;
  var i = Number(Q.get("i")); if (i >= 0 && D.traces[unit] && i < D.traces[unit].length) ti = i;
  tabs(); if (mode === "trace") showTrace(); else showParsons();
})();
