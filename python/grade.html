<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Grade Python | Teacher</title>
<link rel="icon" href="../assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0E14;--panel:#121722;--card:#171D2B;--rule:#26304A;--ink:#E8ECF3;--soft:#93A0B8;--acc:#FB923C;--ok:#34D399;--bad:#F87171}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "Manrope",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
a{color:#FDBA74}button,select,input,textarea{font:inherit}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--rule)}
.brand{font-weight:800}
select,input,textarea{background:var(--card);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:6px 8px}
.btn{background:var(--card);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600;text-decoration:none}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);color:#0B0E14;border-color:var(--acc);font-weight:800}.btn.sm{padding:3px 8px;font-size:12px}
.sp{flex:1}
#login{max-width:340px;margin:12vh auto;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:24px}
#login h1{margin:0 0 10px;font-size:20px}
#login input{width:100%;margin:8px 0 12px}
#app{display:none;flex:1;min-height:0;grid-template-columns:360px 1fr}
#app.show{display:grid}
.list{border-right:1px solid var(--rule);overflow:auto}
.list table{width:100%;border-collapse:collapse;font-size:13px}
.list th{position:sticky;top:0;background:var(--panel);text-align:left;padding:7px 8px;font:700 11px "JetBrains Mono",monospace;color:var(--soft);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--rule)}
.list td{padding:8px;border-bottom:1px solid #1b2337;vertical-align:top}
.list tr.row{cursor:pointer}.list tr.row:hover{background:#141a29}.list tr.row.sel{background:#1c2540;outline:1px solid var(--acc)}
.pill{display:inline-block;border-radius:100px;padding:1px 8px;font-size:11px;font-weight:700}
.pill.s{background:#0F2A22;color:#6EE7B7}.pill.d{background:#2A2110;color:#FCD34D}.pill.g{background:#14213D;color:#93C5FD}
.detail{display:flex;flex-direction:column;min-width:0;min-height:0}
.dhead{padding:10px 14px;border-bottom:1px solid var(--rule);display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel)}
.dhead h2{margin:0;font-size:17px}.dhead small{color:var(--soft)}
.dbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 320px}
.view{min-height:0;overflow:auto}
.code{display:flex;font:13px/20px "JetBrains Mono",monospace;background:#080B11;min-height:100%}
.code .g{flex:0 0 46px;text-align:right;color:#4E5B78;padding:10px 8px 10px 0;border-right:1px solid var(--rule);user-select:none;white-space:pre}
.code pre{margin:0;padding:10px 14px;white-space:pre;color:#E6EAF2;position:relative;z-index:1}
.code .cw{position:relative;flex:1;min-width:0}
#hlm{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;z-index:0}
.mk{position:absolute;left:0;right:0;height:20px;background:rgba(251,191,36,.18);border-left:3px solid #FBBF24}
.mk.add{background:transparent;border-left:0;border-bottom:2px dashed #34D399}
.mk b{position:absolute;right:10px;top:1px;font:700 11px Manrope,sans-serif;color:#FDE68A;background:#2A2110;border:1px solid #FBBF24;border-radius:100px;padding:0 9px;line-height:17px;white-space:nowrap}
.mk.add b{color:#A7F3D0;background:#0B2A22;border-color:#34D399}
.ck .wh{margin-left:6px;font-size:11px;padding:1px 8px;cursor:pointer}
.bx{margin:10px 0 2px;font-size:12px;line-height:1.35;border-top:1px solid var(--rule);padding-top:7px}.bx b{color:var(--ink)}.bx .bxt{color:var(--soft)}
.abadge{display:inline-block;margin-left:6px;font:600 10.5px Manrope,sans-serif;border-radius:100px;padding:0 8px;line-height:17px;border:1px solid;white-space:nowrap}
.abadge.ok{color:#A7F3D0;border-color:#34D399}.abadge.part{color:#FDE68A;border-color:#FBBF24}.abadge.no{color:#FCA5A5;border-color:#F87171}
.right{border-left:1px solid var(--rule);overflow:auto;padding:12px;background:var(--bg)}
.right h3{margin:14px 0 6px;font:700 11.5px "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.right h3:first-child{margin-top:0}
.outbox{background:#080B11;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;font:12.5px/1.5 "JetBrains Mono",monospace;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto}
.grade input[type=number]{width:90px}
.grade textarea{width:100%;min-height:90px;margin:6px 0}
.ck{display:flex;gap:7px;padding:3px 0;font-size:12.5px;line-height:1.35}
.ck .m{flex:0 0 17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:800;margin-top:1px}
.ck.ok .m{background:var(--ok);color:#04210f}.ck.no .m{background:#3a1c1c;color:var(--bad);border:1px solid var(--bad)}
.ck.ok{color:#B7F1D4}.ck small{color:var(--soft)}
.autoscore{font-size:26px;font-weight:800;color:var(--acc)}
.bar2{height:8px;background:#0D1220;border-radius:6px;overflow:hidden;margin:4px 0 8px}.bar2 i{display:block;height:100%;background:var(--ok)}
.right details{margin:6px 0;font-size:12.5px}.right summary{cursor:pointer;color:var(--soft)}.right details li{margin:3px 0}
.warn{color:#FCD34D}
.empty{padding:40px;color:var(--soft);text-align:center}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111c;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;display:none;z-index:9}
@media(max-width:1000px){#app{grid-template-columns:1fr}.list{max-height:34vh}.dbody{grid-template-columns:1fr}.right{border-left:0}}
</style>
</head>
<body>
<div id="login">
  <h1>Teacher: Grade Python</h1>
  <div style="color:var(--soft);font-size:13px">Enter the teacher PIN.</div>
  <input id="pin" type="password" placeholder="PIN" autocomplete="off">
  <button class="btn pri" id="go" style="width:100%">Open</button>
  <div id="lerr" style="color:var(--bad);margin-top:10px;font-size:13px"></div>
  <div style="margin-top:14px"><a href="editor.html">&larr; Python editor</a></div>
</div>

<div class="top" id="top" style="display:none">
  <span class="brand">🧑‍🏫 Grade Python</span>
  <label>Assignment <select id="slot"></select></label>
  <label>Period <select id="period"><option value="">All periods</option></select></label>
  <label><input type="checkbox" id="onlySub"> Submitted only</label>
  <button class="btn" id="reload">Reload</button>
  <button class="btn" id="csv">Export CSV</button>
  <span class="sp"></span>
  <span id="count" style="color:var(--soft);font-size:13px"></span>
  <a class="btn" href="editor.html">Python editor</a>
</div>

<div id="app">
  <div class="list"><table><thead><tr><th>Student</th><th>Period</th><th>Status</th><th>Grade</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="noRows" style="display:none">No work for this assignment yet.</div></div>
  <div class="detail" id="detail"><div class="empty">Pick a student on the left.</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
var API = "/api/pycode", $ = function (i) { return document.getElementById(i); };
var pin = "", rows = [], sel = null, counts = {};
try { pin = sessionStorage.getItem("pypin") || ""; } catch (e) {}
function esc(t) { return String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function toast(t) { var e = $("toast"); e.textContent = t; e.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(function () { e.style.display = "none"; }, 2200); }
function api(b) { b.pin = pin; return fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) }).then(function (r) { return r.json(); }); }
function slotLabel(id) {
  if (id === "free") return "Practice";
  var A = (typeof ASSIGN !== "undefined" && ASSIGN[id]) || null, u = A && A.unit ? String(A.unit).split(":")[0] + " · " : "";
  return u + "Assignment " + (A && A.num ? A.num : id.slice(1)) + (A && A.title ? ": " + A.title : "");
}
function fmt(t) { return t ? new Date(t).toLocaleString() : ""; }


/* ---------- assignments (instructions + automatic checks) ---------- */
var ASSIGN = {};
function loadAssignments() { return api({ action: "adminAssignments" }).then(function (j) { if (j && j.ok) { ASSIGN = j.assignments || {}; rebuildSlots(); } }); }
function rebuildSlots() {
  var sl = $("slot"); if (!sl || !sl.options.length) return; var cur = sl.value, ids = ["free"]; for (var i = 1; i <= 30; i++) ids.push("a" + i), 0;
  sl.innerHTML = ids.map(function (id) { return '<option value="' + id + '">' + esc(slotLabel(id)) + " (" + (counts[id] || 0) + ")</option>"; }).join(""); sl.value = cur;
}
function splitCode(code) {
  /* separates comment text from code, ignoring # inside quotes */
  var comments = [], codeOnly = [], notes = [];
  var PROSE = /(?:^|\s)(?:the|is|are|was|a|an|to|of|it|that|this|so|because|when|means|makes|stores|asks|checks|says|gives|shows|changed|different)(?=[\s,.:;!?]|$)/i;
  var codeLike = function (t) { return !PROSE.test(t) && /^\s*([A-Za-z_]\w*(\[[^\]]*\])?\s*([-+*\/%]?=[^=]|\()|[A-Za-z_]\w*\.\w+\(|(if|elif|for|while|def|return|import|from|else|try|except|print|input)\b)/.test(t); };
  String(code || "").split("\n").forEach(function (line) {
    var q = "", cut = -1;
    for (var i = 0; i < line.length; i++) { var ch = line.charAt(i); if (q) { if (ch === "\\") i++; else if (ch === q) q = ""; } else if (ch === '"' || ch === "'") q = ch; else if (ch === "#") { cut = i; break; } }
    if (cut < 0) codeOnly.push(line); else {
      codeOnly.push(line.slice(0, cut)); var ctext = line.slice(cut + 1); comments.push(ctext);
      /* a note is written text, not commented-out code; a trailing note after commented-out code counts too */
      var parts = ctext.split("#"); parts.forEach(function (p, pi) { if (p.trim() && !(pi === 0 && codeLike(p))) notes.push(p); });
    }
  });
  return { comments: comments, notes: notes, code: codeOnly.join("\n") };
}
function runChecks(slotId, code) {
  var A = ASSIGN[slotId], checks = (A && A.checks) || [], sp = splitCode(code), res = [], credit = 0, possible = 0;
  checks.forEach(function (c) {
    var n = 0, flags = String(c.flags || "").replace(/g/g, "");
    try {
      if (c.where === "comments" || c.where === "notes") { var re = new RegExp(c.re, flags); (c.where === "notes" ? sp.notes : sp.comments).forEach(function (l) { if (re.test(l)) n++; }); }
      else { var m = (c.where === "code" ? sp.code : String(code || "")).match(new RegExp(c.re, "g" + flags)); n = m ? m.length : 0; }
    } catch (e) { n = 0; }
    var w = c.pts || 1; possible += w; credit += w * Math.min(1, n / c.min);
    var lines = [];
    try { if (c.where !== "comments" && c.where !== "notes") { var rx = new RegExp(c.re, "g" + flags), mm, txt = String(code || ""); while ((mm = rx.exec(txt)) && lines.length < 60) { lines.push(txt.slice(0, mm.index).split("\n").length); if (mm[0].length === 0) rx.lastIndex++; } } } catch (e) { lines = []; }
    res.push({ label: c.label, min: c.min, count: n, ok: n >= c.min, pts: w, box: c.box, lines: lines });
  });
  var passed = res.filter(function (x) { return x.ok; }).length;
  return { results: res, passed: passed, total: res.length, pct: possible ? Math.round(credit * 100 / possible) : null, comments: sp.comments.filter(function (l) { return l.trim(); }).length, kept: sp.comments.filter(function (l) { return /^\s*([A-Za-z_]\w*\s*=[^=]|print\(|input\(|[A-Za-z_]\w*\s*=\s*\w+\()/.test(l); }).length, lines: sp.code.split("\n").filter(function (l) { return l.trim(); }).length };
}
function stepTexts(slotId) {
  var A = ASSIGN[slotId], out = []; if (!A) return out;
  A.blocks.forEach(function (b) { var items = b.make || b.where || b.build; if (items) items.forEach(function (t) { out.push(t); }); });
  return out;
}
var pyReady = null;
function getPy() {
  if (pyReady) return pyReady;
  pyReady = new Promise(function (resolve, reject) {
    var sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js";
    sc.onload = function () { loadPyodide().then(resolve, reject); }; sc.onerror = reject; document.head.appendChild(sc);
  });
  return pyReady;
}
function syntaxCheck(code) {
  return getPy().then(function (py) {
    py.globals.set("student_code", code);
    return String(py.runPython("try:\n    compile(student_code, 'student', 'exec')\n    result = ''\nexcept SyntaxError as e:\n    result = 'Line ' + str(e.lineno) + ': ' + str(e.msg)\nresult"));
  });
}
function openApp() {
  api({ action: "adminCounts" }).then(function (j) {
    if (j.error) { $("lerr").textContent = j.error; try { sessionStorage.removeItem("pypin"); } catch (e) {} return; }
    try { sessionStorage.setItem("pypin", pin); } catch (e) {}
    counts = j.counts || {};
    $("login").style.display = "none"; $("top").style.display = "flex"; $("app").className = "show";
    var h = "", ids = ["free"]; for (var i = 1; i <= 30; i++) ids.push("a" + i);
    ids.forEach(function (id) { h += '<option value="' + id + '">' + slotLabel(id) + " (" + (counts[id] || 0) + ")</option>"; });
    $("slot").innerHTML = h;
    var first = ids.filter(function (id) { return id !== "free" && counts[id]; })[0] || "free"; $("slot").value = first;
    load();
  });
}
$("go").onclick = function () { pin = $("pin").value; openApp(); };
$("pin").onkeydown = function (e) { if (e.key === "Enter") $("go").click(); };
if (pin) openApp();

function load() {
  return loadAssignments().then(function () { return api({ action: "adminList", slot: $("slot").value }); }).then(function (j) {
    if (j.error) { toast(j.error); return; }
    rows = j.students || [];
    var periods = {}; rows.forEach(function (r) { if (r.period) periods[r.period] = 1; });
    var cur = $("period").value; $("period").innerHTML = '<option value="">All periods</option>' + Object.keys(periods).sort().map(function (p) { return "<option>" + esc(p) + "</option>"; }).join(""); $("period").value = periods[cur] ? cur : "";
    render();
  });
}
function render() {
  var per = $("period").value, only = $("onlySub").checked;
  var list = rows.filter(function (r) { return (!per || r.period === per) && (!only || r.submission); }).sort(function (a, b) { return String(a.rosterName || a.name).localeCompare(String(b.rosterName || b.name)); });
  $("rows").innerHTML = list.map(function (r) {
    var t = r.submission && r.submission.teacher;
    return '<tr class="row' + (sel === r.email ? " sel" : "") + '" data-e="' + esc(r.email) + '"><td>' + esc(r.rosterName || r.name) + '</td><td>' + esc(r.period) + '</td><td>' + (r.submission ? '<span class="pill s">Submitted</span>' : '<span class="pill d">Draft</span>') + '</td><td>' + (t && t.score !== null ? '<span class="pill g">' + esc(t.score) + "</span>" : "") + "</td></tr>";
  }).join("");
  $("noRows").style.display = list.length ? "none" : "block";
  $("count").textContent = list.filter(function (r) { return r.submission; }).length + " submitted, " + list.length + " total";
  Array.prototype.forEach.call($("rows").querySelectorAll("tr.row"), function (tr) { tr.onclick = function () { sel = tr.getAttribute("data-e"); render(); showDetail(); }; });
  return list;
}
function showDetail() {
  var r = rows.filter(function (x) { return x.email === sel; })[0]; if (!r) return;
  var rec = r.submission || r.draft, t = r.submission && r.submission.teacher, lines = (rec.code || "").split("\n"), g = lines.map(function (_, i) { return i + 1; }).join("\n");
  $("detail").innerHTML = '<div class="dhead"><h2>' + esc(r.rosterName || r.name) + '</h2><small>' + esc(r.email) + ' &middot; Period ' + esc(r.period) + ' &middot; ' + (r.submission ? "Submitted " + esc(fmt(rec.submittedAt)) + (rec.count > 1 ? " (#" + rec.count + ")" : "") : "Draft saved " + esc(fmt(rec.savedAt)) + " (not submitted)") + ' &middot; ' + (rec.mode === "karel" ? "Karel" : "Python") + "</small></div>" +
    '<div class="dbody"><div class="view"><div class="code"><div class="g">' + g + '</div><div class="cw"><div id="hlm"></div><pre>' + esc(rec.code) + '</pre></div></div></div><div class="right">' +
    autoPanel(r, rec) + "<h3>Student's output</h3><div class=\"outbox\">" + (esc(rec.output) || "<span style='color:var(--soft)'>(none saved)</span>") + "</div>" +
    (r.submission ? '<h3>Your grade</h3><div class="grade"><label>Score <input type="number" id="gScore" min="0" max="1000" value="' + esc(t && t.score !== null ? t.score : "") + '"></label><textarea id="gComment" placeholder="Comment for the student">' + esc(t ? t.comment : "") + '</textarea><button class="btn pri" id="gSave">Save grade</button> <button class="btn sm" id="gDel" style="float:right">Delete submission</button></div>' : '<p style="color:var(--soft)">Not submitted yet, so it cannot be graded.</p>') +
    "</div></div>";
  afterDetail(r, rec);
  if (r.submission) {
    $("gSave").onclick = function () { api({ action: "adminGrade", slot: $("slot").value, email: r.email, score: $("gScore").value, comment: $("gComment").value }).then(function (j) { if (j.ok) { r.submission.teacher = j.teacher; toast("Saved"); render(); } else toast(j.error || "Could not save"); }); };
    $("gDel").onclick = function () { if (!confirm("Delete this submission? The student's saved draft stays.")) return; api({ action: "adminDelete", slot: $("slot").value, email: r.email, draft: false }).then(function (j) { if (j.ok) { toast("Deleted"); load().then(function () { $("detail").innerHTML = '<div class="empty">Pick a student on the left.</div>'; }); } else toast(j.error || "Could not delete"); }); };
  }
}

/* the instruction checkboxes of an assignment, in order, with the step each one is under and its place in that step */
function boxMeta(slotId) {
  var A = ASSIGN[slotId], out = [], step = "Before you submit", pos = 0; if (!A) return out;
  A.blocks.forEach(function (b) {
    if (b.h) { step = String(b.h).replace(/:.*$/, ""); pos = 0; return; }
    var items = b.make || b.where || b.build; if (!items) return;
    items.forEach(function (t) { pos++; out.push({ step: step, pos: pos, text: String(t).replace(/[[(.+?)|[a-z0-9_-]+]]/g, "$1").replace(/[*`]/g, "") }); });
  });
  return out;
}
/* automatic checks grouped under the checkbox they belong to */
function checkRows(ck, slotId) {
  var meta = boxMeta(slotId), groups = {}, order = [], h = "";
  ck.results.forEach(function (x) {
    var first = Array.isArray(x.box) ? x.box[0] : x.box, key = first === undefined || first === null ? "none" : String(first);
    if (!groups[key]) { groups[key] = []; order.push(key); }
    groups[key].push(x);
  });
  order.sort(function (a, b) { return (a === "none" ? 1e9 : +a) - (b === "none" ? 1e9 : +b); });
  order.forEach(function (key) {
    var list = groups[key], m = key === "none" ? null : meta[+key], met = list.filter(function (x) { return x.ok; }).length;
    var cls = met === list.length ? "ok" : (met ? "part" : "no");
    h += '<div class="bx">' + (m ? "<b>" + esc(m.step) + ", checkbox " + m.pos + "</b> <span class=\"bxt\">" + esc(m.text.length > 110 ? m.text.slice(0, 107) + "..." : m.text) + "</span>" : "<b>Not tied to a checkbox</b>") + ' <span class="abadge ' + cls + '">' + met + " of " + list.length + " met</span></div>";
    list.forEach(function (x) {
      var extra = Array.isArray(x.box) && x.box.length > 1 ? ' <small>(also counts for ' + (x.box.length - 1) + ' other checkbox' + (x.box.length > 2 ? "es" : "") + ")</small>" : "";
      h += '<div class="ck ' + (x.ok ? "ok" : "no") + '" data-lbl="' + esc(x.label).replace(/"/g, "&quot;") + '"><span class="m">' + (x.ok ? "&#10003;" : "&#10005;") + "</span><span>" + esc(x.label) + " <small>(found " + x.count + ", need " + x.min + "; " + (x.pts || 1) + " pt" + ((x.pts || 1) === 1 ? "" : "s") + ")</small>" + extra + "</span></div>";
    });
  });
  return h;
}
/* Did the student cover everything, and in the right order?  A checklist for the teacher: no score. */
function stepOrder(code) {
  /* the order of the steps is read from the student's own step comments (# Step 3: ...), the first one of each number */
  var pos = {}, lines = String(code || "").split("\n");
  lines.forEach(function (l, i) { var m = /^\s*#\s*(?:step|trace)\s*(\d+)\b/i.exec(l); if (m && pos[+m[1]] === undefined) pos[+m[1]] = i + 1; });
  var keys = Object.keys(pos).map(Number).sort(function (x, y) { return x - y; }), bad = [];
  for (var i = 1; i < keys.length; i++) if (pos[keys[i]] < pos[keys[i - 1]]) bad.push("Step " + keys[i] + " (line " + pos[keys[i]] + ") comes before Step " + keys[i - 1] + " (line " + pos[keys[i - 1]] + ")");
  return { steps: keys.length, bad: bad };
}
function coveragePanel(ck, slotId, code) {
  if (!ck.total) return '<p style="color:var(--soft)">No coverage checklist for this assignment.</p>';
  var meta = boxMeta(slotId), groups = {}, order = [];
  ck.results.forEach(function (x) {

/* "show where": the server works out where each missing check belongs in the student's code (same hints the student sees) */
var LH = 20, TOP = 10;

    out = n ? '<div class="mk add" style="top:' + (TOP + (n - 1) * LH) + 'px"><b>↓ add it after this line</b></div>' : '<div class="mk add" style="top:' + (TOP - 3) + 'px;height:0;border-bottom:0;border-top:2px dashed #34D399"><b>↓ add it at the top</b></div>';

function scrollToLine(h) { var n = h && h.lines && h.lines.length ? h.lines[0] : (h && h.after) || 1, v = document.querySelector(".dbody .view"); if (v) v.scrollTop = Math.max(0, TOP + (n - 4) * LH); }

    });
    var all = $("showAll"), clr = $("clrMarks");

function afterDetail(r, rec) {

}
