name = "dok-analyzer"
main = "src/index.js"
compatibility_date = "2025-06-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Secrets (set with `npx wrangler secret put <NAME>` inside dok-analyzer/):
#   ANTHROPIC_API_KEY  required - your Claude API key
#   ACCESS_CODE        optional - if set, teachers must enter it to analyze (keeps strangers from spending your API credit)
