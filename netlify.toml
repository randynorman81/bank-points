[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/announcements"
  to = "/.netlify/functions/announcements"
  status = 200

[[redirects]]
  from = "/api/latework"
  to = "/.netlify/functions/latework"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/data"
  status = 200
