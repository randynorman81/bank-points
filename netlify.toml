[build]
  publish = "."
  functions = "netlify/functions"

# Short link for the SAT English Trap Trainer (served from /sat-english/)
[[redirects]]
  from = "/sat"
  to = "/sat-english/"
  status = 200

# Unit 6 lessons were renumbered (6.2 -> 6.1, 6.3 -> 6.2). Keep old links working.
[[redirects]]
  from = "/ist/unit-6/6-2-building-a-knowledge-base"
  to = "/ist/unit-6/6-1-building-a-knowledge-base"
  status = 301
  force = true

[[redirects]]
  from = "/ist/unit-6/6-2-building-a-knowledge-base.html"
  to = "/ist/unit-6/6-1-building-a-knowledge-base.html"
  status = 301
  force = true

[[redirects]]
  from = "/ist/unit-6/6-3-star-in-a-video"
  to = "/ist/unit-6/6-2-star-in-a-video"
  status = 301
  force = true

[[redirects]]
  from = "/ist/unit-6/6-3-star-in-a-video.html"
  to = "/ist/unit-6/6-2-star-in-a-video.html"
  status = 301
  force = true

[[redirects]]
  from = "/api/announcements"
  to = "/.netlify/functions/announcements"
  status = 200

[[redirects]]
  from = "/api/latework"
  to = "/.netlify/functions/latework"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/data"
  status = 200
