<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank Points — Quick Give</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="assets/logo.png">
<style>
  .quick-wrap { max-width: 480px; margin: 0 auto; }
  .quick-card { padding: 24px; }
  .name-field { position: relative; }
  .selected-chip {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--gray-100);
    border: 1px solid var(--gray-300);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.95rem;
  }
  .selected-chip.show { display: flex; }
  .selected-chip .chip-name { font-weight: 600; }
  .selected-chip .chip-period { color: var(--gray-500); font-size: 0.82rem; margin-left: 6px; }
  .selected-chip button {
    background: none; border: none; color: var(--gray-500); cursor: pointer;
    font-size: 0.8rem; text-decoration: underline; padding: 0;
  }
  .suggest-list {
    position: absolute;
    top: calc(100% + 4px);
    left: 0; right: 0;
    background: var(--white);
    border: 1px solid var(--gray-300);
    border-radius: 8px;
    max-height: 240px;
    overflow-y: auto;
    z-index: 20;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    display: none;
  }
  .suggest-list.show { display: block; }
  .suggest-item {
    padding: 10px 14px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--gray-100);
  }
  .suggest-item:last-child { border-bottom: none; }
  .suggest-item:hover, .suggest-item.active { background: var(--gray-100); }
  .suggest-item .s-name { font-weight: 500; }
  .suggest-item .s-period { color: var(--gray-500); font-size: 0.8rem; white-space: nowrap; }
  .suggest-empty { padding: 12px 14px; color: var(--gray-500); font-size: 0.85rem; }
  .points-row { display: flex; gap: 10px; align-items: stretch; }
  .points-row input[type="number"] { text-align: center; font-size: 1.3rem; font-weight: 600; }
  .quick-presets { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .preset-btn {
    border: 1px solid var(--gray-300);
    background: var(--white);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .preset-btn:hover, .preset-btn.active { background: var(--black); color: var(--white); border-color: var(--black); }
  .give-submit { width: 100%; padding: 14px; font-size: 1.05rem; margin-top: 4px; }
  .give-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .flash-banner {
    display: none;
    background: var(--black);
    color: var(--white);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 16px;
    font-size: 0.95rem;
  }
  .flash-banner.show { display: block; }
  .flash-banner strong { font-size: 1.05rem; }
  .log-list { margin-top: 8px; }
  .log-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--gray-100);
    font-size: 0.88rem;
  }
  .log-row:last-child { border-bottom: none; }
  .log-row .log-main { flex: 1; min-width: 0; }
  .log-row .log-name { font-weight: 600; }
  .log-row .log-desc { color: var(--gray-500); }
  .log-row .log-pts { white-space: nowrap; font-weight: 600; }
  .top-links { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .top-links a { font-size: 0.85rem; color: var(--gray-500); }
</style>
</head>
<body>

<div id="site-header-root"></div>

<main>
  <div class="quick-wrap">

    <div id="pin-inline" class="card" style="display:none;">
      <div id="pin-alert"></div>
      <form class="stack" id="pin-form">
        <div class="field">
          <label for="pin-input">Admin PIN <span class="hint" style="margin:0;">(once per browser session)</span></label>
          <input type="password" id="pin-input" inputmode="numeric" autocomplete="off" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary">Unlock</button>
      </form>
    </div>

    <div id="dashboard" style="display:none;">
      <div class="top-links">
        <h2 style="margin:0;">Quick Give</h2>
        <a href="admin.html">Full Admin &rarr;</a>
      </div>
      <p class="hint" style="margin-top:-6px; margin-bottom:16px;">Type a name, what it's for, how many points &mdash; done. Works across every period.</p>

      <div id="flash-banner" class="flash-banner"></div>

      <div class="card quick-card">
        <div id="give-alert"></div>
        <form class="stack" id="give-form" autocomplete="off">
          <div class="field name-field">
            <label for="name-input">Student</label>
            <input type="text" id="name-input" placeholder="Start typing a name&hellip;" autocomplete="off" required>
            <div id="suggest-list" class="suggest-list"></div>
            <div id="selected-chip" class="selected-chip">
              <span><span class="chip-name" id="chip-name"></span><span class="chip-period" id="chip-period"></span></span>
              <button type="button" id="chip-change">change</button>
            </div>
          </div>

          <div class="field">
            <label for="desc-input">What did they do?</label>
            <input type="text" id="desc-input" placeholder="e.g. Helped a classmate debug their code" required>
          </div>

          <div class="field">
            <label for="points-input">Points</label>
            <div class="points-row">
              <input type="number" id="points-input" min="1" step="1" placeholder="0" required>
            </div>
            <div class="quick-presets" id="quick-presets">
              <button type="button" class="preset-btn" data-pts="1">1</button>
              <button type="button" class="preset-btn" data-pts="3">3</button>
              <button type="button" class="preset-btn" data-pts="5">5</button>
              <button type="button" class="preset-btn" data-pts="10">10</button>
              <button type="button" class="preset-btn" data-pts="25">25</button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary give-submit" id="give-submit" disabled>Give Points</button>
        </form>
      </div>

      <div class="card" id="log-card" style="display:none;">
        <h2 style="margin-top:0;">Just Given</h2>
        <p class="hint" style="margin-top:-8px;">This session only &mdash; for a full history, use the Full Admin page.</p>
        <div class="log-list" id="log-list"></div>
      </div>
    </div>

  </div>
</main>

<footer class="site-footer">Bank Points Admin</footer>

<script src="assets/api.js"></script>
<script src="assets/nav.js"></script>
<script>
renderHeader();
const PIN_KEY = 'bankPointsPin';
let roster = [];
let selectedStudent = null;
let sessionLog = [];
let activeSuggestIndex = -1;
let currentMatches = [];

const pinInline = document.getElementById('pin-inline');
const dashboard = document.getElementById('dashboard');
const pinForm = document.getElementById('pin-form');
const pinAlert = document.getElementById('pin-alert');

const nameInput = document.getElementById('name-input');
const suggestList = document.getElementById('suggest-list');
const selectedChip = document.getElementById('selected-chip');
const chipName = document.getElementById('chip-name');
const chipPeriod = document.getElementById('chip-period');
const chipChange = document.getElementById('chip-change');
const descInput = document.getElementById('desc-input');
const pointsInput = document.getElementById('points-input');
const giveForm = document.getElementById('give-form');
const giveAlert = document.getElementById('give-alert');
const giveSubmit = document.getElementById('give-submit');
const flashBanner = document.getElementById('flash-banner');
const logCard = document.getElementById('log-card');
const logList = document.getElementById('log-list');

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

function setAlert(el, type, message) {
  el.innerHTML = message ? `<div class="alert alert-${type}">${message}</div>` : '';
}

function getPin() {
  return sessionStorage.getItem(PIN_KEY) || '';
}

async function authedPost(payload) {
  const res = await apiPost(Object.assign({}, payload, { pin: getPin() }));
  if (res.error === 'Invalid PIN') {
    sessionStorage.removeItem(PIN_KEY);
    dashboard.style.display = 'none';
    pinInline.style.display = 'block';
    setAlert(pinAlert, 'error', 'Your session expired. Please re-enter the PIN.');
  }
  return res;
}

pinForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const pin = document.getElementById('pin-input').value.trim();
  setAlert(pinAlert, 'info', 'Checking&hellip;');
  try {
    const res = await apiPost({ action: 'verifyPin', pin: pin });
    if (res.ok) {
      sessionStorage.setItem(PIN_KEY, pin);
      pinAlert.innerHTML = '';
      unlock();
    } else {
      setAlert(pinAlert, 'error', res.error || 'Incorrect PIN.');
    }
  } catch (err) {
    setAlert(pinAlert, 'error', 'Could not reach the server.');
  }
});

function unlock() {
  pinInline.style.display = 'none';
  dashboard.style.display = 'block';
  loadRoster();
}

async function loadRoster() {
  try {
    const data = await authedPost({ action: 'adminRoster' });
    if (data.error) {
      setAlert(giveAlert, 'error', data.error);
      return;
    }
    roster = (data.students || []).slice().sort((a, b) => a.name.localeCompare(b.name));
    nameInput.disabled = false;
    nameInput.focus();
  } catch (err) {
    setAlert(giveAlert, 'error', 'Could not load the roster.');
  }
}

function clearSelection() {
  selectedStudent = null;
  selectedChip.classList.remove('show');
  nameInput.style.display = '';
  nameInput.value = '';
  updateSubmitState();
}

function selectStudent(student) {
  selectedStudent = student;
  chipName.textContent = student.name;
  chipPeriod.textContent = ` — ${student.period}`;
  selectedChip.classList.add('show');
  nameInput.style.display = 'none';
  closeSuggestions();
  updateSubmitState();
  descInput.focus();
}

chipChange.addEventListener('click', () => {
  clearSelection();
  nameInput.focus();
});

function closeSuggestions() {
  suggestList.classList.remove('show');
  suggestList.innerHTML = '';
  activeSuggestIndex = -1;
  currentMatches = [];
}

function renderSuggestions(matches) {
  currentMatches = matches;
  activeSuggestIndex = matches.length ? 0 : -1;
  if (matches.length === 0) {
    suggestList.innerHTML = '<div class="suggest-empty">No matching student</div>';
    suggestList.classList.add('show');
    return;
  }
  suggestList.innerHTML = matches.map((s, i) => `
    <div class="suggest-item${i === 0 ? ' active' : ''}" data-idx="${i}">
      <span class="s-name">${escapeHtml(s.name)}</span>
      <span class="s-period">${escapeHtml(s.period)}</span>
    </div>
  `).join('');
  suggestList.classList.add('show');
}

nameInput.addEventListener('input', () => {
  const q = nameInput.value.trim().toLowerCase();
  if (!q) { closeSuggestions(); return; }
  const matches = roster.filter(s => s.name.toLowerCase().includes(q)).slice(0, 8);
  renderSuggestions(matches);
});

nameInput.addEventListener('keydown', (e) => {
  if (!suggestList.classList.contains('show')) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (currentMatches.length === 0) return;
    activeSuggestIndex = (activeSuggestIndex + 1) % currentMatches.length;
    highlightActive();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (currentMatches.length === 0) return;
    activeSuggestIndex = (activeSuggestIndex - 1 + currentMatches.length) % currentMatches.length;
    highlightActive();
  } else if (e.key === 'Enter') {
    if (activeSuggestIndex >= 0 && currentMatches[activeSuggestIndex]) {
      e.preventDefault();
      selectStudent(currentMatches[activeSuggestIndex]);
    }
  } else if (e.key === 'Escape') {
    closeSuggestions();
  }
});

function highlightActive() {
  [...suggestList.querySelectorAll('.suggest-item')].forEach((el, i) => {
    el.classList.toggle('active', i === activeSuggestIndex);
  });
}

suggestList.addEventListener('click', (e) => {
  const item = e.target.closest('.suggest-item');
  if (!item) return;
  const idx = Number(item.dataset.idx);
  if (currentMatches[idx]) selectStudent(currentMatches[idx]);
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.name-field')) closeSuggestions();
});

document.getElementById('quick-presets').addEventListener('click', (e) => {
  const btn = e.target.closest('.preset-btn');
  if (!btn) return;
  pointsInput.value = btn.dataset.pts;
  [...document.querySelectorAll('.preset-btn')].forEach(b => b.classList.toggle('active', b === btn));
  updateSubmitState();
});

pointsInput.addEventListener('input', () => {
  [...document.querySelectorAll('.preset-btn')].forEach(b => b.classList.toggle('active', b.dataset.pts === pointsInput.value));
  updateSubmitState();
});
descInput.addEventListener('input', updateSubmitState);

function updateSubmitState() {
  const amount = Number(pointsInput.value);
  const ok = selectedStudent && descInput.value.trim() && amount > 0;
  giveSubmit.disabled = !ok;
}

function showFlash(student, amount, description) {
  flashBanner.innerHTML = `<strong>+${escapeHtml(amount)} points</strong> &rarr; ${escapeHtml(student.name)} (${escapeHtml(student.period)})<br><span style="opacity:0.8;">${escapeHtml(description)}</span>`;
  flashBanner.classList.add('show');
  clearTimeout(showFlash._t);
  showFlash._t = setTimeout(() => flashBanner.classList.remove('show'), 4000);
}

function addToLog(student, amount, description) {
  sessionLog.unshift({ student, amount, description, time: new Date() });
  logCard.style.display = 'block';
  logList.innerHTML = sessionLog.map(entry => `
    <div class="log-row">
      <div class="log-main">
        <span class="log-name">${escapeHtml(entry.student.name)}</span>
        <span class="hint" style="margin:0;">${escapeHtml(entry.student.period)}</span><br>
        <span class="log-desc">${escapeHtml(entry.description)}</span>
      </div>
      <div class="log-pts">+${escapeHtml(entry.amount)}</div>
    </div>
  `).join('');
}

giveForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!selectedStudent) return;
  const amount = Number(pointsInput.value);
  const description = descInput.value.trim();
  if (!amount || amount <= 0 || !description) return;

  giveSubmit.disabled = true;
  giveSubmit.textContent = 'Giving&hellip;';
  const res = await authedPost({ action: 'addTransaction', studentId: selectedStudent.id, type: 'EARNED', amount, description });
  giveSubmit.textContent = 'Give Points';

  if (res.error) {
    setAlert(giveAlert, 'error', res.error);
    updateSubmitState();
    return;
  }

  showFlash(selectedStudent, amount, description);
  addToLog(selectedStudent, amount, description);

  clearSelection();
  descInput.value = '';
  pointsInput.value = '';
  [...document.querySelectorAll('.preset-btn')].forEach(b => b.classList.remove('active'));
  giveAlert.innerHTML = '';
  nameInput.focus();
});

nameInput.disabled = true;

if (getPin()) {
  unlock();
} else {
  pinInline.style.display = 'block';
}
</script>
</body>
</html>
